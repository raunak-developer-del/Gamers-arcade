<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Hanoi Neon Towers | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Hanoi Neon Towers</h1><p>Move all rings from the first peg to the third. Never place a larger ring on a smaller one.</p><section class="panel"><div id="pegs" class="arena" style="align-items:end;min-height:190px"></div><p>Tap source peg, then destination peg.</p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let pegs=[[4,3,2,1],[],[]],src=-1,moves=0;function draw(){let e=document.querySelector('#pegs');e.innerHTML='';pegs.forEach((p,i)=>{let b=document.createElement('button');b.style.width='30%';b.style.minHeight='160px';b.style.display='flex';b.style.flexDirection='column-reverse';b.style.alignItems='center';b.textContent='PEG '+(i+1);p.forEach(n=>{let d=document.createElement('span');d.textContent='━'.repeat(n*2+1);d.style.color=['','#00f5ff','#a3ff12','#b84dff','#ff4c9a'][n];d.style.fontSize='1.1rem';b.append(d)});b.onclick=()=>tap(i);e.append(b)});document.querySelector('#status').textContent=`Moves ${moves}/15${pegs[2].length===4?' — perfect transfer!':''}`}function tap(i){if(src<0){if(pegs[i].length)src=i}else{let v=pegs[src].at(-1),top=pegs[i].at(-1);if(src!==i&&(!top||top>v)){pegs[src].pop();pegs[i].push(v);moves++}src=-1}draw()}draw();</script></body></html>
