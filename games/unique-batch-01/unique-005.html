<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Operator Lab — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Operator Lab</h1><p>Choose the missing operator to make the equation true. A quick logic and arithmetic challenge.</p><h2 id="q" style="text-align:center;font-size:32px"></h2><div id="opts" style="display:flex;justify-content:center;flex-wrap:wrap"></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const q=document.querySelector('#q'),o=document.querySelector('#opts'),s=document.querySelector('#status');let score=0,round=0,a,b,c,correct;function make(){a=2+Math.floor(Math.random()*12);b=1+Math.floor(Math.random()*9);let ops=['+','−','×'];correct=ops[Math.floor(Math.random()*3)];c=correct==='+'?a+b:correct==='−'?a-b:a*b;q.textContent=`${a}  ?  ${b}  =  ${c}`;o.innerHTML='';['+','−','×'].sort(()=>Math.random()-.5).forEach(op=>{let z=document.createElement('button');z.textContent=op;z.style.fontSize='25px';z.onclick=()=>{if(op===correct){score++;s.textContent='Correct! Score '+score;round++;if(round===12){o.innerHTML='';q.textContent='LAB COMPLETE';s.textContent='12 equations solved!';return}make()}else{s.textContent='Incorrect operator. Try another.'}};o.append(z)})}make();</script><script src="../../arcade-juice.js" defer></script></body></html>
