<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Ant Colony Architect | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Ant Colony Architect</h1><p>Place food sources and guide ants along the shortest route back to the nest.</p><section class="panel"><div id="colony" class="arena" style="display:grid;grid-template-columns:repeat(6,1fr);max-width:390px"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let nest=30,food=new Set([5,11,17]),path=new Set([24,25,26,27,21,15,9,8,7,6]),placed=new Set();function draw(){let e=document.querySelector('#colony');e.innerHTML='';for(let i=0;i<36;i++){let b=document.createElement('button');b.className='cell';b.textContent=i===nest?'🐜':food.has(i)?'🍯':path.has(i)||placed.has(i)?'·':' ';b.onclick=()=>{placed.add(i);draw()};e.append(b)}document.querySelector('#status').textContent=`Trail markers ${placed.size}/6. Place markers from nest toward food.`;if([5,11,17].every(f=>placed.has(f)))document.querySelector('#status').textContent='All food sources connected!'}draw();</script></body></html>
