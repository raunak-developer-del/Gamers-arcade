<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Intersection Controller | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Intersection Controller</h1><p>Change traffic lights to prevent collisions while letting cars cross.</p><section class="panel"><div class="arena"><button id="north">North light</button><button id="east">East light</button></div><p id="traffic"></p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let n='red',e='green',passed=0;function draw(){document.querySelector('#traffic').textContent=`North: ${n.toUpperCase()} · East: ${e.toUpperCase()} · Cars passed ${passed}`;document.querySelector('#status').textContent=n===e&&n==='green'?'CRASH RISK! Both directions green.':'Keep only one direction green.'}north.onclick=()=>{n=n==='red'?'green':'red';if(n==='green')e='red';passed++;draw()};east.onclick=()=>{e=e==='red'?'green':'red';if(e==='green')n='red';passed++;draw()};draw();</script></body></html>
