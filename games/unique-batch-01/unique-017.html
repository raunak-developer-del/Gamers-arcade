ntent=glyph[p]||'';q.onclick=()=>click(i);b.append(q)})}function click(i){if(sel<0){if(A[i]&&side(A[i])===turn){sel=i;draw()}return}let p=A[sel],dx=i%8-sel%8,dy=(i/8|0)-(sel/8|0),ok=false,k=p.toLowerCase();if(side(A[i])===turn){sel=i;draw();return}if(k==='n')ok=(Math.abs(dx)===1&&Math.abs(dy)===2)||(Math.abs(dx)===2&&Math.abs(dy)===1);if(k==='k')ok=Math.abs(dx)<=1&&Math.abs(dy)<=1;if(k==='p'){let dir=turn==='w'?-1:1;ok=dx===0&&dy===dir&&!A[i]||Math.abs(dx)===1&&dy===dir&&A[i]}if(['r','b','q'].includes(k)){ok=(k==='q'||k==='r'&&(dx===0||dy===0)||k==='b'&&Math.abs(dx)===Math.abs(dy))&&(dx!==0||dy!==0);if(ok){let sx=Math.sign(dx),sy=Math.sign(dy),x=sel%8+sx,y=(sel/8|0)+sy;while(x!==i%8||y!==(i/8|0)){if(A[y*8+x])ok=false;x+=sx;y+=sy}}}if(ok){A[i]=p==='P'&&i<8?'Q':p==='p'&&i>=56?'q':p;A[sel]='';turn=turn==='w'?'b':'w';s.textContent=(turn==='w'?'White':'Black')+' to move. Basic move rules; castling/en passant/checkmate adjudication not implemented.'}sel=-1;draw()}draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
