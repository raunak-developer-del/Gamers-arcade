<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Shape Rotation Lab | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Shape Rotation Lab</h1><p>Rotate the shape to match the target orientation.</p><section class="panel"><div class="arena" style="font-size:4rem"><span id="shape">➤</span><span>→</span><span id="target">↓</span></div><div class="arena"><button id="rotate">Rotate 90°</button><button id="check">Check</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let rot=0,target=2;const dirs=['➤','⬇','⬅','⬆'];function draw(){document.querySelector('#shape').textContent=dirs[rot%4];document.querySelector('#target').textContent=dirs[target];document.querySelector('#status').textContent=`Orientation ${rot%4*90}°`}document.querySelector('#rotate').onclick=()=>{rot=(rot+1)%4;draw()};document.querySelector('#check').onclick=()=>{if(rot===target){target=Math.random()*4|0;rot=0;draw();document.querySelector('#status').textContent='Matched! New target generated.'}else document.querySelector('#status').textContent='Orientation does not match yet.'};draw();</script></body></html>
