<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Word Ladder Lab | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Word Ladder Lab</h1><p>Change one letter at a time to transform COLD into WARM using valid four-letter words.</p><section class="panel"><p>Start: <b>COLD</b> → Goal: <b>WARM</b></p><div class="arena"><input id="entry" maxlength="4" placeholder="WORD"><button id="add">Add step</button></div><ol id="steps"></ol><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const valid=new Set(['CORD','CARD','WARD','WARM','WORD','WORM','CORM','BOLD','TOLD','SOLD','WOLD','WORE','WARE','CARE','CAME','LAME','LARD','HARD','HARM']);let last='COLD',steps=['COLD'];function diff(a,b){return [...a].filter((c,i)=>c!==b[i]).length}function draw(){document.querySelector('#steps').innerHTML=steps.map(x=>`<li>${x}</li>`).join('');document.querySelector('#status').textContent=last==='WARM'?'Ladder complete!':`Current word: ${last}; ${steps.length-1} steps`}document.querySelector('#add').onclick=()=>{let w=document.querySelector('#entry').value.trim().toUpperCase();if(w.length!==4||diff(w,last)!==1||!valid.has(w)){document.querySelector('#status').textContent='Use a listed valid word changing exactly one letter.';return}steps.push(w);last=w;document.querySelector('#entry').value='';draw()};draw();</script></body></html>
