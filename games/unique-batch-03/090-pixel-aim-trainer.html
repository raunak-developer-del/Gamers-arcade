<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Pixel Aim Trainer | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Pixel Aim Trainer</h1><p>Hit the moving targets before they vanish.</p><section class="panel"><canvas id="game" width="420" height="320"></canvas><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let target={x:100,y:100},score=0,shots=0,until=Date.now()+20000;function draw(){x.fillStyle='#02040a';x.fillRect(0,0,420,320);x.strokeStyle='#ff4c9a';x.lineWidth=4;x.beginPath();x.arc(target.x,target.y,18,0,7);x.stroke();x.beginPath();x.moveTo(target.x-25,target.y);x.lineTo(target.x+25,target.y);x.moveTo(target.x,target.y-25);x.lineTo(target.x,target.y+25);x.stroke();document.querySelector('#status').textContent=`Hits ${score} / Shots ${shots} · Click target`}c.onclick=e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*420/r.width,py=(e.clientY-r.top)*320/r.height;shots++;if(Math.hypot(px-target.x,py-target.y)<22)score++;target={x:30+Math.random()*360,y:30+Math.random()*260};draw()};draw();</script></body></html>
