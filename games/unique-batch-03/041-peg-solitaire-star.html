<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Peg Solitaire Star | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Peg Solitaire Star</h1><p>Jump pegs over neighbouring pegs into empty holes to remove the jumped peg. Finish with one peg.</p><section class="panel"><div id="board" class="arena" style="display:grid;grid-template-columns:repeat(7,1fr);max-width:420px"></div><p>Tap a peg, then an empty destination two spaces away.</p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let cells=Array.from({length:49},(_,i)=>{let r=i/7|0,c=i%7;return ((r>=2&&r<=4)||(c>=2&&c<=4))?1:-1});cells[24]=0;let sel=-1;function draw(){let e=document.querySelector('#board');e.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell';b.textContent=v<0?'':v?'●':'○';b.disabled=v<0;b.style.background=i===sel?'#15536a':'#101b2b';b.onclick=()=>tap(i);e.append(b)});document.querySelector('#status').textContent=`Pegs remaining: ${cells.filter(v=>v===1).length}`}function tap(i){if(sel<0){if(cells[i]===1)sel=i}else{let r=sel/7|0,c=sel%7,R=i/7|0,C=i%7;if(cells[i]===0&&((Math.abs(r-R)===2&&c===C)||(Math.abs(c-C)===2&&r===R))){let m=((r+R)/2|0)*7+((c+C)/2|0);if(cells[m]===1){cells[sel]=0;cells[m]=0;cells[i]=1}}sel=-1}draw()}draw();</script></body></html>
