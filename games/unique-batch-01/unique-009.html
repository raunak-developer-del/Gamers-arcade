<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Skybound Platformer — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Skybound Platformer</h1><p>Jump between platforms and collect three stars before falling. Precision platform movement.</p><canvas id="c" width="640" height="420"></canvas><p>← → / A D move, ↑ / W / Space jump. Touch left/right half to move; tap upper half to jump.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let p={x:30,y:340,vx:0,vy:0},keys={},stars=[{x:150,y:280},{x:355,y:205},{x:525,y:120}],platforms=[[0,390,640,30],[80,320,120,12],[240,255,120,12],[410,185,110,12],[520,130,90,12]],done=false;onkeydown=e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup'].includes(e.key.toLowerCase()))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),xx=(e.clientX-r.left)/r.width*640,yy=(e.clientY-r.top)/r.height*420;if(yy<250)p.vy=-8;else keys[xx<320?'a':'d']=true});c.addEventListener('pointerup',()=>{keys.a=keys.d=false});function frame(){x.clearRect(0,0,640,420);x.fillStyle='#080d1b';x.fillRect(0,0,640,420);platforms.forEach(a=>{x.fillStyle='#32445f';x.fillRect(...a)});stars.forEach(a=>{x.fillStyle='#ffb000';x.beginPath();x.arc(a.x,a.y,8,0,7);x.fill()});if(!done){p.vx=((keys.d||keys.arrowright)?3:0)-((keys.a||keys.arrowleft)?3:0);if((keys.w||keys.arrowup||keys[' '])&&p.vy===0)p.vy=-9;p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.x=Math.max(8,Math.min(632,p.x));for(let [a,b,w,h] of platforms)if(p.vy>=0&&p.x>a-10&&p.x<a+w+10&&p.y+12>=b&&p.y+12<=b+12){p.y=b-12;p.vy=0}stars=stars.filter(a=>{if(Math.hypot(a.x-p.x,a.y-p.y)<20){return false}return true});if(!stars.length){done=true;s.textContent='All stars collected!'}if(p.y>430){done=true;s.textContent='You fell! Restart to try again.'}}x.fillStyle='#00f5ff';x.fillRect(p.x-9,p.y-12,18,24);x.fillStyle='#effcff';x.font='16px system-ui';x.fillText('Stars left: '+stars.length,15,25);if(!done)requestAnimationFrame(frame)}frame();</script><script src="../../arcade-juice.js" defer></script></body></html>
