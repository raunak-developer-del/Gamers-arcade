<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Arcade Shopkeeper | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Arcade Shopkeeper</h1><p>Buy stock, set a price, and sell items to satisfy customers while earning profit.</p><section class="panel"><p>Stock: <b id="stock">5</b> · Cash: <b id="cash">20</b></p><div class="arena"><button id="buy">Buy stock (4 coins)</button><label>Price <input id="price" type="range" min="2" max="10" value="5"></label><button id="sell">Open shop</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let stock=5,cash=20,day=0;function draw(){document.querySelector('#stock').textContent=stock;document.querySelector('#cash').textContent=cash;document.querySelector('#status').textContent=`Day ${day} · Set price then open shop.`}document.querySelector('#buy').onclick=()=>{if(cash>=4){cash-=4;stock++;draw()}};document.querySelector('#sell').onclick=()=>{day++;let p=+document.querySelector('#price').value,demand=Math.max(0,7-p+Math.random()*4|0),sold=Math.min(stock,demand);stock-=sold;cash+=sold*p;document.querySelector('#status').textContent=`Sold ${sold} items at ${p} coins each.`;draw()};draw();</script></body></html>
