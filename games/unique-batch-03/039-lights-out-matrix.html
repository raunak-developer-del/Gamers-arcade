<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Lights Out Matrix | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Lights Out Matrix</h1><p>Tap a tile to toggle it and its neighbours. Turn every light off.</p><section class="panel"><div id="board" class="arena" style="display:grid;grid-template-columns:repeat(5,1fr);max-width:390px"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let b=Array.from({length:25},()=>Math.random()<.45?1:0);function draw(){let e=document.querySelector('#board');e.innerHTML='';b.forEach((v,i)=>{let x=document.createElement('button');x.className='cell';x.textContent=v?'✦':'·';x.style.background=v?'#00a9bb':'#0a1320';x.onclick=()=>{[i,i-5,i+5,...(i%5?[i-1]:[]),...(i%5<4?[i+1]:[])].filter(j=>j>=0&&j<25&&!(Math.abs(j-i)===1&&Math.floor(j/5)!==Math.floor(i/5))).forEach(j=>b[j]^=1);draw()};e.append(x)});document.querySelector('#status').textContent=b.every(v=>!v)?'Grid dark — you win!':`${b.reduce((a,v)=>a+v,0)} lights remain`}draw();</script></body></html>
