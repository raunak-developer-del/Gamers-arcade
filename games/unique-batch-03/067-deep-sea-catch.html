<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Deep Sea Catch | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Deep Sea Catch</h1><p>Tap when the bobber plunges to catch a fish; early or late taps miss.</p><section class="panel"><div class="arena" style="font-size:3rem"><span id="bobber">🎣</span></div><button id="cast">Cast line</button><button id="reel">Reel in!</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let phase='idle',score=0,timer;document.querySelector('#cast').onclick=()=>{if(phase!=='idle')return;phase='waiting';document.querySelector('#bobber').textContent='🎣';document.querySelector('#status').textContent='Wait for a bite…';timer=setTimeout(()=>{phase='bite';document.querySelector('#bobber').textContent='🌊';document.querySelector('#status').textContent='BITE! Reel now!';setTimeout(()=>{if(phase==='bite'){phase='idle';document.querySelector('#status').textContent='Fish escaped.'}},900)},700+Math.random()*2500)};document.querySelector('#reel').onclick=()=>{if(phase==='bite'){score++;phase='idle';clearTimeout(timer);document.querySelector('#bobber').textContent='🐟';document.querySelector('#status').textContent=`Fish caught! Total ${score}`}else{phase='idle';clearTimeout(timer);document.querySelector('#status').textContent='Too early — no catch.'}};</script></body></html>
