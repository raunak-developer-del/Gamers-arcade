<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pattern Pulse 497 — Gamers' Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050711;color:#eaf2ff;font:16px system-ui,Arial;display:flex;justify-content:center;min-height:100vh}
main{width:min(96vw,620px);padding:18px 12px 28px;text-align:center}h1{font-size:clamp(22px,5vw,32px);color:#78f2c9;text-shadow:0 0 14px #78f2c980;margin:6px 0}p{color:#b8c5dc;font-size:14px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;aspect-ratio:1/1;max-height:520px;padding:12px;border:2px solid #78f2c9;border-radius:12px;background:#070a16;box-shadow:0 0 18px #78f2c930}
.tile{border:1px solid #365a68;border-radius:12px;background:#101a2b;color:#eaf2ff;font-size:clamp(24px,7vw,42px);font-weight:800;display:flex;align-items:center;justify-content:center;min-width:0;touch-action:manipulation}
.tile.active{background:#78f2c9;color:#06101a;box-shadow:0 0 20px #78f2c980}
.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}button,a{background:#101b2d;color:#eff6ff;border:1px solid #7795bd;border-radius:9px;padding:10px 14px;font-weight:700;text-decoration:none;font-size:14px}
#message{min-height:22px;color:#78f2c9;font-size:13px;margin-top:8px}.stats{margin:10px 0;font-weight:700}
</style>
</head>
<body><main>
<h1>Pattern Pulse 497</h1>
<p>Watch the glowing sequence, then repeat it by tapping the tiles. Each round adds one more step.</p>
<div class="stats">Round: <b id="round">1</b> · Score: <b id="score">0</b></div>
<div id="board" aria-label="Pattern Pulse game board">
<button class="tile" data-i="0" aria-label="Tile 1">●</button><button class="tile" data-i="1" aria-label="Tile 2">◆</button><button class="tile" data-i="2" aria-label="Tile 3">▲</button>
<button class="tile" data-i="3" aria-label="Tile 4">✦</button><button class="tile" data-i="4" aria-label="Tile 5">⬟</button><button class="tile" data-i="5" aria-label="Tile 6">✚</button>
<button class="tile" data-i="6" aria-label="Tile 7">⬢</button><button class="tile" data-i="7" aria-label="Tile 8">✿</button><button class="tile" data-i="8" aria-label="Tile 9">✧</button>
</div>
<div id="message">Press Start to begin.</div>
<div class="buttons"><button id="start">Start / Replay</button><button id="reset">Restart</button><a href="../index.html">Game library</a></div>
</main>
<script>
(()=>{
const tiles=[...document.querySelectorAll('.tile')],roundEl=document.getElementById('round'),scoreEl=document.getElementById('score'),msg=document.getElementById('message');
let sequence=[],inputAt=0,round=1,score=0,accepting=false,playToken=0;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function flash(i,ms=300){tiles[i].classList.add('active');return wait(ms).then(()=>tiles[i].classList.remove('active'))}
async function showSequence(token){accepting=false;msg.textContent='Watch the sequence…';await wait(400);for(const i of sequence){if(token!==playToken)return;await flash(i,360);await wait(150)}if(token===playToken){accepting=true;msg.textContent='Your turn! Repeat the sequence.'}}
function begin(){playToken++;sequence=[];inputAt=0;round=1;score=0;roundEl.textContent=round;scoreEl.textContent=score;sequence.push(Math.floor(Math.random()*tiles.length));showSequence(playToken)}
function nextRound(){round++;score+=10;roundEl.textContent=round;scoreEl.textContent=score;sequence.push(Math.floor(Math.random()*tiles.length));inputAt=0;showSequence(playToken)}
tiles.forEach((tile,i)=>tile.addEventListener('click',async()=>{if(!accepting)return;accepting=false;await flash(i,120);if(i!==sequence[inputAt]){msg.textContent='Not quite! Press Start / Replay to try again.';accepting=false;return}inputAt++;if(inputAt===sequence.length){msg.textContent='Correct! Get ready…';await wait(500);if(accepting===false)nextRound()}else accepting=true}));
document.getElementById('start').onclick=begin;document.getElementById('reset').onclick=begin;
})();
</script>
</body></html>
