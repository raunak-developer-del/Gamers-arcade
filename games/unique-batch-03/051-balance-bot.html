<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Balance Bot | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Balance Bot</h1><p>Balance the scale by selecting weights that match the target mass.</p><section class="panel"><p>Target mass: <b id="target">17</b> units</p><div id="weights" class="arena"></div><p>Selected total: <b id="sum">0</b></p><button id="check">Balance</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const weights=[1,2,3,5,8,13],target=17;let chosen=new Set();function draw(){let e=document.querySelector('#weights');e.innerHTML='';weights.forEach(w=>{let b=document.createElement('button');b.textContent=w+' kg';b.style.background=chosen.has(w)?'#14513e':'#101e30';b.onclick=()=>{chosen.has(w)?chosen.delete(w):chosen.add(w);draw()};e.append(b)});document.querySelector('#sum').textContent=[...chosen].reduce((a,b)=>a+b,0)}document.querySelector('#check').onclick=()=>document.querySelector('#status').textContent=[...chosen].reduce((a,b)=>a+b,0)===target?'Scale balanced!':'Not balanced yet.';draw();</script></body></html>
