<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Snake Classic | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>Snake Classic</h1><p>Eat the food to grow. Avoid walls and your own tail. Arrow keys or swipe.</p><section class="panel"><canvas id="game" width="400" height="400"></canvas><p>Arrow keys or swipe. Tap canvas to start moving.</p><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),st=document.querySelector('#status');let s=[[8,10],[7,10],[6,10]],d=[1,0],food=[13,10],score=0,dead=false;function draw(){x.fillStyle='#02040a';x.fillRect(0,0,400,400);x.fillStyle='#ff4c9a';x.fillRect(food[0]*20,food[1]*20,18,18);x.fillStyle='#00f5ff';s.forEach(([a,b])=>x.fillRect(a*20,b*20,18,18));st.textContent=`Score ${score}${dead?' — game over! Restart to try again.':''}`}function tick(){if(dead)return;let h=[s[0][0]+d[0],s[0][1]+d[1]];if(h[0]<0||h[1]<0||h[0]>=20||h[1]>=20||s.some(([a,b],i)=>i<s.length-1&&a===h[0]&&b===h[1])){dead=true;draw();return}s.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;do{food=[Math.random()*20|0,Math.random()*20|0]}while(s.some(([a,b])=>a===food[0]&&b===food[1]))}else s.pop();draw()}document.addEventListener('keydown',e=>{let q={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(q&&q[0]!==-d[0]&&q[1]!==-d[1]){d=q;e.preventDefault()}});let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))d=[Math.sign(dx),0];else d=[0,Math.sign(dy)]},{passive:true});draw();setInterval(tick,130);</script><script src="../../arcade-juice.js" defer></script></body></html>
