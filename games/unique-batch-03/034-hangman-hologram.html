<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Hangman Hologram | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Hangman Hologram</h1><p>Guess the hidden word one letter at a time before the energy meter empties.</p><section class="panel"><p id="word" class="arena" style="font-size:2rem;letter-spacing:.4em"></p><div id="letters" class="arena"></div><p id="mistakes"></p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const words=['NEBULA','CIPHER','GALAXY','QUARTZ','ROCKET','JUNGLE'];let answer=words[Math.random()*words.length|0],used=[],bad=0,done=false;function draw(){document.querySelector('#word').textContent=[...answer].map(c=>used.includes(c)?c:'_').join(' ');document.querySelector('#mistakes').textContent=`Mistakes ${bad}/6`;let e=document.querySelector('#letters');e.innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(c=>{let b=document.createElement('button');b.textContent=c;b.disabled=used.includes(c)||done;b.onclick=()=>guess(c);e.append(b)});document.querySelector('#status').textContent=done?(bad>=6?'The word was '+answer:'Word decoded!'):'Decode the word.'}function guess(c){used.push(c);if(!answer.includes(c))bad++;if(bad>=6||[...answer].every(c=>used.includes(c)))done=true;draw()}document.querySelector('#restart').onclick=()=>location.reload();draw();</script></body></html>
