<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Mini Golf Comet | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Mini Golf Comet</h1><p>Put the ball into the hole with a single shot. Choose power and direction.</p><section class="panel"><canvas id="game" width="420" height="300"></canvas><div class="arena"><label>Angle <input id="angle" type="range" min="0" max="180" value="35"></label><label>Power <input id="power" type="range" min="1" max="12" value="6"></label><button id="shot">Take shot</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let ball={x:35,y:260},hole={x:380,y:40},shots=0;function draw(){x.fillStyle='#103c31';x.fillRect(0,0,420,300);x.fillStyle='#000';x.beginPath();x.arc(hole.x,hole.y,13,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,7,0,7);x.fill();document.querySelector('#status').textContent=`Shots ${shots} · Distance ${Math.round(Math.hypot(ball.x-hole.x,ball.y-hole.y))}`}document.querySelector('#shot').onclick=()=>{shots++;let a=Number(document.querySelector('#angle').value)*Math.PI/180,p=Number(document.querySelector('#power').value)*18;ball.x=Math.max(7,Math.min(413,ball.x+Math.cos(a)*p));ball.y=Math.max(7,Math.min(293,ball.y-Math.sin(a)*p));if(Math.hypot(ball.x-hole.x,ball.y-hole.y)<18)document.querySelector('#status').textContent='Hole in! Score '+shots;draw()};draw();</script></body></html>
