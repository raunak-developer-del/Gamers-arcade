<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Grid Command Tactics | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Grid Command Tactics</h1><p>Move your unit to capture the control point while avoiding enemy zones.</p><section class="panel"><div id="battlefield" class="arena" style="display:grid;grid-template-columns:repeat(6,1fr);max-width:390px"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let pos=30,goal=5,enemies=new Set([8,14,20,26]),walls=new Set([7,13,19]);function draw(){let e=document.querySelector('#battlefield');e.innerHTML='';for(let i=0;i<36;i++){let b=document.createElement('button');b.className='cell';b.textContent=i===pos?'🟦':i===goal?'🏁':enemies.has(i)?'🟥':walls.has(i)?'■':'';b.onclick=()=>move(i);e.append(b)}document.querySelector('#status').textContent=pos===goal?'Control point captured!':'Move one tile per turn; avoid red enemy zones.'}function move(i){if(Math.abs(i-pos)===1&&Math.floor(i/6)===Math.floor(pos/6)||Math.abs(i-pos)===6){if(!walls.has(i)&&!enemies.has(i))pos=i;draw()}}draw();</script></body></html>
