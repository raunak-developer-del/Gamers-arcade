<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Mole Patrol | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Mole Patrol</h1><p>Tap the glowing mole before it disappears. Earn points in 20 seconds.</p><section class="panel"><div id="holes" class="arena" style="display:grid;grid-template-columns:repeat(3,1fr);max-width:360px"></div><button id="start">Start 20-second round</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let score=0,active=-1,playing=false,until=0,timer;function draw(){let e=document.querySelector('#holes');e.innerHTML='';for(let i=0;i<9;i++){let b=document.createElement('button');b.className='cell';b.style.height='75px';b.textContent=i===active?'🐹':'○';b.style.background=i===active?'#14513e':'#101e30';b.onclick=()=>{if(playing&&i===active){score++;active=-1;draw()}};e.append(b)}document.querySelector('#status').textContent=`Score ${score}${playing?'':' · Round ended'}`}document.querySelector('#start').onclick=()=>{score=0;playing=true;until=Date.now()+20000;clearInterval(timer);timer=setInterval(()=>{if(Date.now()>until){playing=false;active=-1;clearInterval(timer)}else active=Math.random()*9|0;draw()},500);draw()};draw();</script></body></html>
