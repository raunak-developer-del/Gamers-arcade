<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Shadow Sneak | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Shadow Sneak</h1><p>Reach the exit without stepping into a guard’s line of sight.</p><section class="panel"><div id="map" class="arena" style="display:grid;grid-template-columns:repeat(7,1fr);max-width:380px"></div><p>Use arrow keys or tap adjacent tiles.</p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let pos=35,exit=6,guards=[10,18,25],walls=[8,9,16,23,30,31];function draw(){let e=document.querySelector('#map');e.innerHTML='';for(let i=0;i<42;i++){let b=document.createElement('button');b.className='cell';b.textContent=i===pos?'🕵️':i===exit?'🚪':guards.includes(i)?'👁️':walls.includes(i)?'■':'';b.style.background=walls.includes(i)?'#444':'#101e30';b.onclick=()=>move(i);e.append(b)}document.querySelector('#status').textContent=pos===exit?'Escape successful!':guards.includes(pos)?'Caught! Restart to try again.':'Stay out of guard sightlines.'}function move(i){if(Math.abs(i-pos)===1&&Math.floor(i/7)===Math.floor(pos/7)||Math.abs(i-pos)===7){if(!walls.includes(i))pos=i;draw()}}document.addEventListener('keydown',e=>{let i=pos+({ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key]||0);if(i>=0&&i<42)move(i)});draw();</script></body></html>
