<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Pong Duel | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>Pong Duel</h1><p>Move your paddle with mouse, touch, or up/down arrows. First to 5 wins.</p><section class="panel"><canvas id="game" width="600" height="360"></canvas><p>Move pointer/touch vertically or use ↑ and ↓. Play against a simple CPU.</p><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),st=document.querySelector('#status');let py=140,by=180,bx=300,vx=4,vy=2,ps=0,cs=0;function draw(){x.fillStyle='#02040a';x.fillRect(0,0,600,360);x.setLineDash([8,8]);x.strokeStyle='#1b4c5f';x.beginPath();x.moveTo(300,0);x.lineTo(300,360);x.stroke();x.setLineDash([]);x.fillStyle='#00f5ff';x.fillRect(18,py,12,80);x.fillStyle='#a3ff12';x.fillRect(570,by,12,80);x.fillStyle='white';x.fillRect(bx,by+20,12,12);x.font='28px system-ui';x.fillText(ps,250,35);x.fillText(cs,330,35);st.textContent=ps>=5||cs>=5?(ps>cs?'You win!':'CPU wins!'):'First to 5 points.'}function reset(dir){bx=300;by=140;vx=4*dir;vy=(Math.random()*4-2)||2}function tick(){if(ps>=5||cs>=5)return;bx+=vx;by+=vy;if(by<0||by>348)vy*=-1;let target=by-20;by+=Math.max(-3,Math.min(3,target-by));if(bx<30&&bx>18&&by+12>py&&by<py+80){vx=Math.abs(vx)*1.05;vy+=(by+20-(py+40))*.06}if(bx>558&&bx<582&&by+12>by-999){}if(bx>558&&by+12>by&&by<by+80){vx=-Math.abs(vx)}if(bx<0){cs++;reset(1)}if(bx>600){ps++;reset(-1)}draw()}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();py=Math.max(0,Math.min(280,(e.clientY-r.top)*360/r.height-40))});document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')py=Math.max(0,py-20);if(e.key==='ArrowDown')py=Math.min(280,py+20)});draw();setInterval(tick,25);</script><script src="../../arcade-juice.js" defer></script></body></html>
