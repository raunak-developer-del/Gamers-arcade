<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>2048 — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>2048</h1><p>Slide numbered tiles, combine equal values, and reach 2048.</p><div id="board" style="display:grid;grid-template-columns:repeat(4,1fr);max-width:400px"></div><p>Arrow keys or swipe/tap direction.</p><div><button onclick="move(0,-1)">↑</button><button onclick="move(-1,0)">←</button><button onclick="move(1,0)">→</button><button onclick="move(0,1)">↓</button></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const b=document.querySelector('#board'),s=document.querySelector('#status');let A=Array(16).fill(0),done=false;function spawn(){let z=A.map((v,i)=>v? -1:i).filter(i=>i>=0);if(z.length)A[z[Math.random()*z.length|0]]=Math.random()<.9?2:4}function move(dx,dy){if(done)return;let old=A.join();for(let line=0;line<4;line++){let ids=Array.from({length:4},(_,j)=>dy?((dy>0?3-j:j)*4+line):(line*4+(dx>0?3-j:j))),vals=ids.map(i=>A[i]).filter(Boolean),out=[];for(let j=0;j<vals.length;j++){if(vals[j]===vals[j+1]){out.push(vals[j]*2);j++}else out.push(vals[j])}ids.forEach((id,j)=>A[id]=out[j]||0)}if(A.join()!==old)spawn();if(A.includes(2048)){done=true;s.textContent='2048 reached!'}draw()}function draw(){b.innerHTML='';A.forEach((v,i)=>{let q=document.createElement('button');q.style.cssText='aspect-ratio:1;padding:0;margin:2px;font-size:clamp(16px,4vw,28px);background:'+(v?'#'+(['00f5ff','a3ff12','ff4fd8','b84dff','ffb000'][Math.min(4,Math.log2(v)-1)]):'#121b2c');q.textContent=v||'';b.append(q)});s.textContent='Highest tile: '+Math.max(...A)}onkeydown=e=>{let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m)move(...m)};spawn();spawn();draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
