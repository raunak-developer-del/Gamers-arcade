<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Blackjack Neon Table | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Blackjack Neon Table</h1><p>Get as close to 21 as possible without busting. Dealer stands on 17.</p><section class="panel"><h2 id="hand"></h2><div class="arena"><button id="hit">Hit</button><button id="stand">Stand</button><button id="deal">New hand</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let deck=[],hand=[],dealer=[],done=false;function card(){return deck.pop()}function val(a){let s=a.reduce((n,c)=>n+Math.min(10,c),0),aces=a.filter(c=>c===1).length;while(aces--&&s+10<=21)s+=10;return s}function draw(){document.querySelector('#hand').textContent='You: '+hand.map(v=>v===1?'A':v).join(' ')+` (${val(hand)}) · Dealer: ${done?dealer.map(v=>v===1?'A':v).join(' '):dealer[0]+' + ?'}`;document.querySelector('#status').textContent=done?(val(hand)>21?'Bust!':val(dealer)>21||val(hand)>val(dealer)?'You win!':val(hand)===val(dealer)?'Push.':'Dealer wins.'):'Hit or stand.';document.querySelector('#hit').disabled=done;document.querySelector('#stand').disabled=done}function deal(){deck=Array.from({length:52},(_,i)=>i%13+1).sort(()=>Math.random()-.5);hand=[card(),card()];dealer=[card(),card()];done=false;draw()}document.querySelector('#hit').onclick=()=>{hand.push(card());if(val(hand)>=21)done=true;draw()};document.querySelector('#stand').onclick=()=>{while(val(dealer)<17)dealer.push(card());done=true;draw()};document.querySelector('#deal').onclick=deal;deal();</script></body></html>
