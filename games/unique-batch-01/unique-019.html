<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tic-Tac-Toe — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Tic-Tac-Toe</h1><p>Classic three-in-a-row game for two local players.</p><div id="board" style="display:grid;grid-template-columns:repeat(3,1fr);max-width:360px"></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const b=document.querySelector('#board'),s=document.querySelector('#status');let A=Array(9).fill(''),t='X',done=false;function draw(){b.innerHTML='';A.forEach((v,i)=>{let q=document.createElement('button');q.style.cssText='aspect-ratio:1;font-size:42px;margin:3px';q.textContent=v;q.onclick=()=>{if(done||A[i])return;A[i]=t;if([[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(k=>A[k]===t))){done=true;s.textContent=t+' wins!'}else if(A.every(Boolean)){done=true;s.textContent='Draw!'}else{t=t==='X'?'O':'X';s.textContent=t+' turn'}draw()};b.append(q)})}draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
