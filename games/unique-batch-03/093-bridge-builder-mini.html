<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Bridge Builder Mini | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Bridge Builder Mini</h1><p>Place supports under the bridge to carry a moving truck across the gap.</p><section class="panel"><div class="arena"><button data-support="1">Support 1</button><button data-support="2">Support 2</button><button data-support="3">Support 3</button><button id="test">Send truck</button></div><p id="bridge"></p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let supports=new Set(),crossed=false;document.querySelectorAll('[data-support]').forEach(b=>b.onclick=()=>{let n=+b.dataset.support;supports.has(n)?supports.delete(n):supports.add(n);document.querySelector('#bridge').textContent='Supports placed at: '+[...supports].join(', ')});document.querySelector('#test').onclick=()=>{crossed=supports.size>=2;document.querySelector('#status').textContent=crossed?'Bridge held! Truck crossed.':'Bridge collapsed — add at least two supports.'};</script></body></html>
