<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Bubble Pop Geometry | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Bubble Pop Geometry</h1><p>Aim a bubble into a matching cluster to pop groups of three or more.</p><section class="panel"><canvas id="game" width="420" height="360"></canvas><p>Tap the board to aim and launch the current colour.</p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let balls=[];for(let r=0;r<5;r++)for(let col=0;col<7;col++)balls.push({x:30+col*55,y:35+r*35,c:['#00f5ff','#b84dff','#a3ff12'][Math.random()*3|0]});let color='#00f5ff',score=0;function draw(){x.clearRect(0,0,420,360);balls.forEach(b=>{x.fillStyle=b.c;x.beginPath();x.arc(b.x,b.y,14,0,7);x.fill()});x.fillStyle=color;x.beginPath();x.arc(210,325,14,0,7);x.fill();document.querySelector('#status').textContent=`Bubbles left ${balls.length} · Score ${score}`}c.onclick=e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*420/r.width,py=(e.clientY-r.top)*360/r.height;let hit=balls.find(b=>Math.hypot(b.x-px,b.y-py)<32);if(hit){let same=balls.filter(b=>b.c===hit.c&&Math.hypot(b.x-hit.x,b.y-hit.y)<85);if(same.length>=3){balls=balls.filter(b=>!same.includes(b));score+=same.length*10}else{balls.push({x:px,y:py,c:color})}}color=['#00f5ff','#b84dff','#a3ff12'][Math.random()*3|0];draw()};draw();</script></body></html>
