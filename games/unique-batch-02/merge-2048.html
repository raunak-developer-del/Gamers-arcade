<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>2048 Merge | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>2048 Merge</h1><p>Slide tiles with arrow keys or swipe. Merge equal numbers to reach 2048.</p><section class="panel"><div id="board" class="board" style="grid-template-columns:repeat(4,1fr);max-width:380px;touch-action:pan-y"></div><p>Use arrow keys or swipe across the board.</p><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let b=Array(16).fill(0),score=0,over=false;const el=document.querySelector('#board'),st=document.querySelector('#status');function spawn(){let e=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}function draw(){el.innerHTML='';b.forEach(v=>{let x=document.createElement('div');x.className='cell';x.style.background=v?'#'+({2:'17364b',4:'14515b',8:'176d80',16:'5b438b',32:'853c88',64:'b34378',128:'a26a25',256:'b78b25',512:'d2a92d',1024:'d6c24d',2048:'a3ff12'}[v]||'00bcd4'):'#0b1421';x.textContent=v||'';x.style.borderRadius='8px';el.append(x)});st.textContent=`Score ${score}${over?' — no moves left!':''}`}function move(dir){if(over)return;let old=b.join(',');for(let k=0;k<4;k++){let ids=[];for(let j=0;j<4;j++)ids.push(dir==='left'?k*4+j:dir==='right'?k*4+3-j:dir==='up'?j*4+k:(3-j)*4+k);let a=ids.map(i=>b[i]).filter(Boolean),out=[];for(let j=0;j<a.length;j++){if(a[j]===a[j+1]){out.push(a[j]*2);score+=a[j]*2;j++}else out.push(a[j])}ids.forEach((id,j)=>b[id]=out[j]||0)}if(old!==b.join(',')){spawn();if(!b.includes(2048)&&!b.some((v,i)=>v===0||[1,4,-1,-4].some(d=>{let n=i+d;return n>=0&&n<16&&((d===1||d===-1)?Math.floor(n/4)===Math.floor(i/4):true)&&b[n]===v})))over=true;draw()}}document.addEventListener('keydown',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();move(m)}});let sx=0,sy=0;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});spawn();spawn();draw();</script><script src="../../arcade-juice.js" defer></script></body></html>
