<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Water Sort Lab | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Water Sort Lab</h1><p>Pour the top colour between tubes. Sort each tube into a single colour.</p><section class="panel"><div id="tubes" class="arena"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let tubes=[['C','B','A','C'],['A','C','B','A'],['B','A','C','B'],[]],sel=-1;function draw(){let e=document.querySelector('#tubes');e.innerHTML='';tubes.forEach((t,i)=>{let b=document.createElement('button');b.style.display='flex';b.style.flexDirection='column-reverse';b.style.minWidth='68px';b.style.height='190px';b.textContent='Tube '+(i+1);t.forEach(v=>{let s=document.createElement('span');s.textContent='━━━━';s.style.color=({A:'#00f5ff',B:'#b84dff',C:'#a3ff12'})[v];b.append(s)});b.onclick=()=>tap(i);e.append(b)});document.querySelector('#status').textContent=tubes.every(t=>!t.length||t.every(v=>v===t[0])&&t.length===4)?'All colours sorted!':'Tap a source tube, then a destination.'}function tap(i){if(sel<0){if(tubes[i].length)sel=i}else if(sel!==i&&tubes[i].length<4&&(!tubes[i].length||tubes[i].at(-1)===tubes[sel].at(-1))){tubes[i].push(tubes[sel].pop());sel=-1}else sel=i;draw()}draw();</script></body></html>
