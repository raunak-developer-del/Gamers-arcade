<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Timeblock Tactician | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Timeblock Tactician</h1><p>Fit tasks into a six-slot schedule without overlaps; each task has a time window.</p><section class="panel"><div id="slots" class="arena"></div><p id="tasks"></p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const tasks=[{n:'Study',ok:[0,1,2]},{n:'Practice',ok:[2,3,4]},{n:'Break',ok:[1,3,5]}];let chosen={};function draw(){let e=document.querySelector('#slots');e.innerHTML='';for(let i=0;i<6;i++){let b=document.createElement('button');b.textContent=`Slot ${i+1}: ${chosen[i]||'Empty'}`;b.onclick=()=>{let t=tasks.find(t=>!Object.values(chosen).includes(t.n)&&t.ok.includes(i));if(t)chosen[i]=t.n;else delete chosen[i];draw()};e.append(b)}document.querySelector('#tasks').textContent='Tasks: '+tasks.map(t=>t.n).join(', ');document.querySelector('#status').textContent=tasks.every(t=>Object.values(chosen).includes(t.n))?'Schedule complete!':'Place each task into an allowed slot.'}draw();</script></body></html>
