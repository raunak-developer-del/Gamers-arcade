<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pac-Man — Gamers' Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05070e;color:#effcff;font:16px system-ui;text-align:center;padding:12px;display:flex;justify-content:center}main{width:min(100%,460px)}h1{color:#ffe600;text-shadow:0 0 14px #ffe600;margin:6px 0}p{font-size:14px;margin:6px 0}canvas{display:block;width:min(94vw,420px);height:auto;margin:12px auto;background:#030510;border:2px solid #456dff;border-radius:12px;touch-action:manipulation}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:5px;justify-content:center;margin:10px}.pad button,button,a{background:#111a2c;color:#fff;border:1px solid #67b7ff;border-radius:10px;padding:11px 14px;font-weight:bold;text-decoration:none}.pad button{padding:12px 0}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}small{color:#9db5cb}
</style><link rel="stylesheet" href="arcade-juice.css"></head><body><main><h1>Pac-Man</h1><p>Eat the dots and avoid the ghost! Use arrow keys, WASD, or the buttons.</p><p>Score: <b id="score">0</b> · <span id="status">Ready!</span></p><canvas id="c" width="420" height="450" aria-label="Pac-Man maze"></canvas><div class="pad"><span></span><button onclick="move(0,-1)" aria-label="Up">▲</button><span></span><button onclick="move(-1,0)" aria-label="Left">◀</button><button onclick="move(0,1)" aria-label="Down">▼</button><button onclick="move(1,0)" aria-label="Right">▶</button></div><div class="row"><button onclick="reset()">Restart</button><a href="index.html">Game library</a></div><small>Gamers' Arcade · Pac-Man</small></main>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
const tile=30,cols=14,rows=15;let map=[],px=1,py=1,dx=1,dy=0,score=0,ghost={x:12,y:13},timer=null,done=false;
function buildMap(){map=Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,col)=>{
 if(r===0||col===0||r===rows-1||col===cols-1)return 1;
 if((r===3||r===7||r===11)&&col>1&&col<cols-2&&col%4!==0)return 1;
 if((col===4||col===9)&&r>2&&r<rows-3&&r%4!==0)return 1;
 return 2;
}));map[1][1]=0;map[1][2]=2;map[13][12]=0;map[12][12]=2;}
function reset(){clearInterval(timer);buildMap();px=1;py=1;dx=1;dy=0;score=0;ghost={x:12,y:13};done=false;scoreEl.textContent=score;statusEl.textContent='Go!';draw();timer=setInterval(tick,170)}
function move(a,b){if(!done){dx=a;dy=b;}}
function canGo(x,y){return y>=0&&y<rows&&x>=0&&x<cols&&map[y][x]!==1;}
function tick(){if(done)return;let nx=px+dx,ny=py+dy;if(canGo(nx,ny)){px=nx;py=ny;if(map[py][px]===2){map[py][px]=0;score+=10;scoreEl.textContent=score;}}
 const options=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[ghost.x+a,ghost.y+b]).filter(([a,b])=>canGo(a,b));if(options.length){options.sort((u,v)=>(Math.abs(u[0]-px)+Math.abs(u[1]-py))-(Math.abs(v[0]-px)+Math.abs(v[1]-py)));const choice=options[Math.random()<.22&&options.length>1?1:0];ghost.x=choice[0];ghost.y=choice[1];}
 if(px===ghost.x&&py===ghost.y){done=true;statusEl.textContent='Caught! Tap Restart to try again.';}else if(!map.some(row=>row.includes(2))){done=true;statusEl.textContent='You win!';}draw();}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const xx=col*tile,yy=r*tile;if(map[r][col]===1){ctx.fillStyle='#162d9a';ctx.fillRect(xx+1,yy+1,tile-2,tile-2);ctx.strokeStyle='#4f7cff';ctx.strokeRect(xx+2,yy+2,tile-4,tile-4);}else{ctx.fillStyle='#070a18';ctx.fillRect(xx,yy,tile,tile);if(map[r][col]===2){ctx.fillStyle='#fff2a6';ctx.beginPath();ctx.arc(xx+15,yy+15,3,0,Math.PI*2);ctx.fill();}}}
 ctx.fillStyle='#ffe600';ctx.beginPath();ctx.moveTo(px*tile+15,py*tile+15);ctx.arc(px*tile+15,py*tile+15,12,.25,Math.PI*2-.25);ctx.closePath();ctx.fill();ctx.fillStyle='#ff4b83';ctx.beginPath();ctx.arc(ghost.x*tile+15,ghost.y*tile+15,12,Math.PI,0);ctx.lineTo(ghost.x*tile+27,ghost.y*tile+26);ctx.lineTo(ghost.x*tile+21,ghost.y*tile+21);ctx.lineTo(ghost.x*tile+15,ghost.y*tile+26);ctx.lineTo(ghost.x*tile+9,ghost.y*tile+21);ctx.lineTo(ghost.x*tile+3,ghost.y*tile+26);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(ghost.x*tile+8,ghost.y*tile+8,4,5);ctx.fillRect(ghost.x*tile+18,ghost.y*tile+8,4,5);}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),d=({arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]})[k];if(d){e.preventDefault();move(d[0],d[1]);}});reset();
</script><script src="arcade-juice.js" defer></script></body></html>
