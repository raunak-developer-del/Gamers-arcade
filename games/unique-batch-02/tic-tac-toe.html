<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Tic-Tac-Toe | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>Tic-Tac-Toe</h1><p>Take turns placing X and O. Make a row of three to win.</p><section class="panel"><div id="board" class="board" style="grid-template-columns:repeat(3,1fr);max-width:330px"></div><button id="new">New round</button><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let b=Array(9).fill(''),turn='X',done=false;const el=document.querySelector('#board'),st=document.querySelector('#status');function draw(){el.innerHTML='';b.forEach((v,i)=>{let x=document.createElement('button');x.className='cell';x.textContent=v;x.style.aspectRatio='1';x.onclick=()=>play(i);el.append(x)});st.textContent=done?'Round over — start a new round.':turn+' to move.'}function play(i){if(done||b[i])return;b[i]=turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(wins.some(w=>w.every(j=>b[j]===turn))){done=true;draw();st.textContent=turn+' wins!';return}if(b.every(Boolean)){done=true;draw();st.textContent='Draw!';return}turn=turn==='X'?'O':'X';draw()}document.querySelector('#new').onclick=()=>{b=Array(9).fill('');turn='X';done=false;draw()};draw();</script><script src="../../arcade-juice.js" defer></script></body></html>
