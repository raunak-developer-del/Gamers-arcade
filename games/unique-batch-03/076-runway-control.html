<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Runway Control | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Runway Control</h1><p>Assign incoming planes to clear runways without sending two planes to the same strip.</p><section class="panel"><div id="planes" class="arena"></div><div class="arena"><button id="r1">Runway 1</button><button id="r2">Runway 2</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let plane=1,cleared=0,occupied=[false,false];function draw(){document.querySelector('#planes').textContent='✈️ Incoming flight '+plane;document.querySelector('#status').textContent=`Landings ${cleared} · Runway occupancy ${occupied.map(x=>x?'BUSY':'CLEAR').join(' / ')}`}function land(i){if(occupied[i]){document.querySelector('#status').textContent='Collision risk! Runway busy.';return}occupied[i]=true;cleared++;plane++;setTimeout(()=>{occupied[i]=false;draw()},900);draw()}document.querySelector('#r1').onclick=()=>land(0);document.querySelector('#r2').onclick=()=>land(1);draw();</script></body></html>
