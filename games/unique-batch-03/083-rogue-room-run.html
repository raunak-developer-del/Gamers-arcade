<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Rogue Room Run | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Rogue Room Run</h1><p>Explore a tiny dungeon, collect a key, and reach the exit while avoiding traps.</p><section class="panel"><div id="dungeon" class="arena" style="display:grid;grid-template-columns:repeat(7,1fr);max-width:400px"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let p=42,key=false,exit=6,traps=new Set([10,18,26,32]),walls=new Set([8,9,16,23,30]);function draw(){let e=document.querySelector('#dungeon');e.innerHTML='';for(let i=0;i<49;i++){let b=document.createElement('button');b.className='cell';b.textContent=i===p?'🧙':i===exit?'🚪':i===12&&!key?'🗝️':traps.has(i)?'⚠️':walls.has(i)?'■':'';b.onclick=()=>move(i);e.append(b)}document.querySelector('#status').textContent=p===exit&&key?'Dungeon escaped!':p===exit?'Find the key first.':'Find the key and avoid traps.'}function move(i){if(Math.abs(i-p)!==1&&Math.abs(i-p)!==7)return;if(walls.has(i))return;p=i;if(p===12)key=true;if(traps.has(p)){document.querySelector('#status').textContent='Trap triggered! Return to entrance.';p=42;key=false}draw()}draw();</script></body></html>
