<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>River Crossing Crew | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>River Crossing Crew</h1><p>Transport the fox, chicken, and grain across the river. The boat carries you plus one item; fox and chicken or chicken and grain cannot be left alone.</p><section class="panel"><div class="arena"><button data-item="you">You / boat</button><button data-item="fox">🦊 Fox</button><button data-item="chicken">🐔 Chicken</button><button data-item="grain">🌾 Grain</button></div><p id="banks"></p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let side={you:0,fox:0,chicken:0,grain:0},boat=0,choice=null;function draw(){document.querySelector('#banks').textContent='Left bank: '+Object.keys(side).filter(k=>side[k]===0).join(', ')+' | Right bank: '+Object.keys(side).filter(k=>side[k]===1).join(', ');document.querySelector('#status').textContent=Object.values(side).every(v=>v===1)?'Everyone crossed safely!':'Choose one passenger on your bank, then move the boat.'}document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{let k=b.dataset.item;if(k==='you'){if(choice&&side[choice]===boat){side[choice]^=1}side.you^=1;boat=side.you;choice=null;let danger=(side.fox===side.chicken&&side.you!==side.fox)||(side.chicken===side.grain&&side.you!==side.chicken);if(danger){document.querySelector('#status').textContent='Oops! Unsafe bank. Restart to try again.';Object.keys(side).forEach(k=>side[k]=0);boat=0}else draw()}else if(side[k]===boat){choice=k;document.querySelector('#status').textContent=k+' selected. Tap You / boat to cross.'}});draw();</script></body></html>
