<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Memory Match | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>Memory Match</h1><p>Flip cards and find all matching pairs using visual memory.</p><section class="panel"><div id="board" class="board" style="grid-template-columns:repeat(4,1fr);max-width:420px"></div><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let vals=['◆','●','▲','■','★','♥','☂','☀', '◆','●','▲','■','★','♥','☂','☀'].sort(()=>Math.random()-.5),open=[],matched=new Set(),moves=0,lock=false;const el=document.querySelector('#board'),st=document.querySelector('#status');function draw(){el.innerHTML='';vals.forEach((v,i)=>{let x=document.createElement('button');x.className='cell';x.textContent=matched.has(i)||open.includes(i)?v:'?';x.style.background=matched.has(i)?'#174a43':'#101b2b';x.onclick=()=>flip(i);el.append(x)});st.textContent=`Moves ${moves} · Pairs ${matched.size/2}/8`}function flip(i){if(lock||matched.has(i)||open.includes(i))return;open.push(i);draw();if(open.length===2){moves++;if(vals[open[0]]===vals[open[1]]){open.forEach(j=>matched.add(j));open=[];draw();if(matched.size===16)st.textContent=`You matched every pair in ${moves} moves!`}else{lock=true;setTimeout(()=>{open=[];lock=false;draw()},650)}}}draw();</script><script src="../../arcade-juice.js" defer></script></body></html>
