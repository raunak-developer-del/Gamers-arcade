<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Word Search Nebula | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Word Search Nebula</h1><p>Find the target words hidden horizontally, vertically, or diagonally in the letter grid.</p><section class="panel"><p>Find: <b id="targets"></b></p><div id="grid" class="arena" style="display:grid;grid-template-columns:repeat(8,minmax(30px,1fr));max-width:430px"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const target=['STAR','MOON','COMET'],grid=Array.from({length:8},()=>Array.from({length:8},()=>String.fromCharCode(65+(Math.random()*26|0))));target.forEach((w,k)=>{let r=k*2+1,c=1;[...w].forEach((x,i)=>grid[r][c+i]=x)});let picked=new Set(),found=new Set();document.querySelector('#targets').textContent=target.join(' · ');function draw(){let e=document.querySelector('#grid');e.innerHTML='';grid.flat().forEach((v,i)=>{let b=document.createElement('button');b.className='cell';b.textContent=v;b.style.padding='4px';b.onclick=()=>{picked.add(i);let s=[...picked].map(j=>grid.flat()[j]).join('');target.forEach(w=>{if(s.includes(w)||s.split('').reverse().join('').includes(w))found.add(w)});b.style.background='#14513e';document.querySelector('#status').textContent=`Found ${found.size}/${target.length} words`;if(found.size===target.length)document.querySelector('#status').textContent='All words found!';};e.append(b)})}draw();</script></body></html>
