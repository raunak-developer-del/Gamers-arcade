<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Target Toss | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Target Toss</h1><p>Throw a ball with a chosen angle and power to land inside the target ring.</p><section class="panel"><canvas id="game" width="420" height="280"></canvas><div class="arena"><label>Angle <input id="angle" type="range" min="10" max="80" value="45"></label><label>Power <input id="power" type="range" min="3" max="12" value="8"></label><button id="throw">Throw</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let shots=0,hit=0;function draw(ball=null){x.fillStyle='#071522';x.fillRect(0,0,420,280);x.fillStyle='#ff4c9a';x.beginPath();x.arc(360,220,22,0,7);x.strokeStyle='#ff4c9a';x.lineWidth=4;x.stroke();if(ball){x.fillStyle='#00f5ff';x.beginPath();x.arc(ball[0],ball[1],7,0,7);x.fill()}}document.querySelector('#throw').onclick=()=>{let a=+document.querySelector('#angle').value*Math.PI/180,p=+document.querySelector('#power').value;let xx=p*23*Math.cos(a),yy=220-p*23*Math.sin(a)+.5*9.8*(xx/(p*23*Math.cos(a)||1))**2*10;shots++;let landed=[Math.max(0,Math.min(420,xx)),Math.max(0,Math.min(280,yy))];let ok=Math.hypot(landed[0]-360,landed[1]-220)<22;if(ok)hit++;draw(landed);document.querySelector('#status').textContent=ok?'Bullseye!':`Miss. Hits ${hit}/${shots}`} ;draw();</script></body></html>
