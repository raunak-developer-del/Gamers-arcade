<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Pinball Prism | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Pinball Prism</h1><p>Launch a pinball and tap the flippers to keep it bouncing through bumpers.</p><section class="panel"><canvas id="game" width="420" height="520"></canvas><div class="arena"><button id="left">Left flipper</button><button id="launch">Launch</button><button id="right">Right flipper</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let ball={x:210,y:470,vx:2,vy:-5},score=0,live=false;function draw(){x.fillStyle='#02040a';x.fillRect(0,0,420,520);[[100,120],[300,160],[210,250],[100,310],[310,330]].forEach(([a,b],i)=>{x.fillStyle=['#00f5ff','#b84dff','#a3ff12'][i%3];x.beginPath();x.arc(a,b,20,0,7);x.fill()});x.fillStyle='white';x.beginPath();x.arc(ball.x,ball.y,8,0,7);x.fill();document.querySelector('#status').textContent=`Score ${score} · ${live?'Ball in play':'Ready to launch'}`}function tick(){if(!live)return;ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.06;if(ball.x<8||ball.x>412)ball.vx*=-1;if(ball.y<8)ball.vy=Math.abs(ball.vy);[[100,120],[300,160],[210,250],[100,310],[310,330]].forEach(([a,b])=>{if(Math.hypot(ball.x-a,ball.y-b)<28){ball.vy*=-1.08;score+=10}});if(ball.y>500){live=false}draw();requestAnimationFrame(tick)}document.querySelector('#launch').onclick=()=>{ball={x:210,y:470,vx:Math.random()*4-2,vy:-6};live=true;tick()};document.querySelector('#left').onclick=()=>{ball.vx-=3;ball.vy=-7};document.querySelector('#right').onclick=()=>{ball.vx+=3;ball.vy=-7};draw();</script></body></html>
