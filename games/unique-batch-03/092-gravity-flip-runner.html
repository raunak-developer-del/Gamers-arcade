<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Gravity Flip Runner | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Gravity Flip Runner</h1><p>Switch gravity to avoid spikes on both floor and ceiling.</p><section class="panel"><canvas id="game" width="420" height="250"></canvas><button id="flip">Flip gravity</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let y=50,g=1,score=0,obs=[];function draw(){x.fillStyle='#02040a';x.fillRect(0,0,420,250);x.fillStyle='#ff4c9a';for(let i=0;i<7;i++){x.fillRect(i*70+30,g===1?205:20,25,25)}x.fillStyle='#00f5ff';x.fillRect(70,y,22,22);document.querySelector('#status').textContent=`Gravity ${g===1?'down':'up'} · flips ${score}`}function tick(){y+=g*2;if(y<0)y=0;if(y>228)y=228;draw();requestAnimationFrame(tick)}document.querySelector('#flip').onclick=()=>{g*=-1;score++};tick();</script></body></html>
