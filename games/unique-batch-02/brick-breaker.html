<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Brick Breaker | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>Brick Breaker</h1><p>Control the paddle and bounce the ball to clear every brick.</p><section class="panel"><canvas id="game" width="600" height="420"></canvas><p>Move pointer or touch to control the paddle. Arrow keys also work.</p><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),st=document.querySelector('#status');let px=250,bx=300,by=300,vx=3,vy=-4,score=0,lives=3,bricks=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:12+col*58,y:30+r*25,on:true});function draw(){x.fillStyle='#02040a';x.fillRect(0,0,600,420);bricks.forEach((b,i)=>{if(b.on){x.fillStyle=['#00f5ff','#a3ff12','#a855f7','#ff4c9a','#ffb454'][Math.floor(i/10)];x.fillRect(b.x,b.y,52,17)}});x.fillStyle='white';x.fillRect(bx,by,10,10);x.fillStyle='#00f5ff';x.fillRect(px,390,100,12);st.textContent=`Score ${score} · Lives ${lives} · Bricks left ${bricks.filter(b=>b.on).length}`}function tick(){if(lives<=0||bricks.every(b=>!b.on))return;bx+=vx;by+=vy;if(bx<0||bx>590)vx*=-1;if(by<0)vy=Math.abs(vy);if(by>380&&bx+10>px&&bx<px+100){vy=-Math.abs(vy);vx+=(bx-(px+50))*.04}if(by>420){lives--;bx=300;by=300;vy=-4}let b=bricks.find(b=>b.on&&bx+10>b.x&&bx<b.x+52&&by+10>b.y&&by<b.y+17);if(b){b.on=false;vy*=-1;score+=10}draw()}function pointer(e){let r=c.getBoundingClientRect();px=Math.max(0,Math.min(500,(e.clientX-r.left)*600/r.width-50))}c.addEventListener('pointermove',pointer);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px=Math.max(0,px-25);if(e.key==='ArrowRight')px=Math.min(500,px+25)});draw();setInterval(tick,20);</script><script src="../../arcade-juice.js" defer></script></body></html>
