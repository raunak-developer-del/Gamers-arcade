<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Micro Tower Defense | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Micro Tower Defense</h1><p>Place turrets along the path and stop waves of creeps reaching the base.</p><section class="panel"><div id="field" class="arena" style="display:grid;grid-template-columns:repeat(6,1fr);max-width:390px"></div><button id="wave">Send wave</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let towers=new Set(),base=10,kills=0,wave=0;const path=new Set([0,1,2,8,14,20,21,22,23,29,35]);function draw(){let e=document.querySelector('#field');e.innerHTML='';for(let i=0;i<36;i++){let b=document.createElement('button');b.className='cell';b.textContent=towers.has(i)?'🔫':path.has(i)?'·':'';b.style.background=path.has(i)?'#293b35':'#101e30';b.onclick=()=>{if(!path.has(i)){towers.add(i);draw()}};e.append(b)}document.querySelector('#status').textContent=`Towers ${towers.size} · Waves ${wave} · Creeps stopped ${kills}`}document.querySelector('#wave').onclick=()=>{wave++;let power=wave+3,fire=towers.size*2;if(fire>=power){kills+=power;document.querySelector('#status').textContent='Wave defended!'}else{base-=power-fire;document.querySelector('#status').textContent=base<=0?'Base overrun!':'Enemies leaked through. Base integrity '+base}draw()};draw();</script></body></html>
