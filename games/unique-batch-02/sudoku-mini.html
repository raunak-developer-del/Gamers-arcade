<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Sudoku Mini | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>Sudoku Mini</h1><p>Complete the 9×9 Sudoku grid. Each row, column, and 3×3 box must contain 1–9.</p><section class="panel"><div id="board" class="board" style="grid-template-columns:repeat(9,1fr);max-width:540px"></div><button id="check">Check solution</button><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const puzzle='530070000600195000098000060800060003400803001700020006060000280000419005000080079'.split('').map(Number),sol='534678912672195348198342567859761423426853791713924856961537284287419635345286179'.split('').map(Number),el=document.querySelector('#board'),st=document.querySelector('#status');function draw(){el.innerHTML='';puzzle.forEach((v,i)=>{let inp=document.createElement('input');inp.maxLength=1;inp.inputMode='numeric';inp.value=v||'';inp.disabled=!!v;inp.setAttribute('aria-label',`row ${Math.floor(i/9)+1} column ${i%9+1}`);inp.style.width='100%';inp.style.aspectRatio='1';inp.style.padding='0';inp.style.borderRadius='2px';inp.style.borderColor=(Math.floor(i/9)%3===2?'#00c9ff':'#345');inp.dataset.i=i;el.append(inp)})}document.querySelector('#check').onclick=()=>{let a=[...el.querySelectorAll('input')].map(v=>Number(v.value)||0);let bad=a.some((v,i)=>v!==sol[i]);st.textContent=bad?'Not solved yet — check the rows, columns, boxes, and digits.':'Excellent! Sudoku solved correctly.'};draw();</script><script src="../../arcade-juice.js" defer></script></body></html>
