<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Quantum Clicker | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Quantum Clicker</h1><p>Generate energy, buy multipliers, and reach one million energy.</p><section class="panel"><h2 id="energy" class="arena">0 energy</h2><div class="arena"><button id="tap">Generate +1</button><button id="upgrade">Buy multiplier (cost 25)</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let energy=0,mult=1;function draw(){document.querySelector('#energy').textContent=Math.floor(energy).toLocaleString()+' energy';document.querySelector('#tap').textContent='Generate +'+mult;document.querySelector('#upgrade').textContent='Buy multiplier (cost '+Math.ceil(mult*25)+')';document.querySelector('#status').textContent=energy>=1e6?'Quantum milestone reached!':'Target: 1,000,000 energy'}document.querySelector('#tap').onclick=()=>{energy+=mult;draw()};document.querySelector('#upgrade').onclick=()=>{let cost=Math.ceil(mult*25);if(energy>=cost){energy-=cost;mult*=2;draw()}};draw();</script></body></html>
