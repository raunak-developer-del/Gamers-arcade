<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Safecracker Dial | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Safecracker Dial</h1><p>Stop the rotating dial in the three target zones to open the safe.</p><section class="panel"><div class="arena" style="font-size:2rem"><span id="dial">◉</span></div><button id="spin">Start dial</button><button id="stop">Stop</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let pos=0,spin=false,hits=0,timer;function draw(){document.querySelector('#dial').style.transform=`rotate(${pos*6}deg)`;document.querySelector('#status').textContent=`Dial ${pos}° · Tumblers ${hits}/3`}document.querySelector('#spin').onclick=()=>{spin=true;clearInterval(timer);timer=setInterval(()=>{pos=(pos+3)%60;draw()},50)};document.querySelector('#stop').onclick=()=>{if(!spin)return;spin=false;clearInterval(timer);if([10,30,50].some(t=>Math.abs(pos-t)<=2)){hits++;document.querySelector('#status').textContent=`Tumbler clicked! ${hits}/3`;if(hits===3)document.querySelector('#status').textContent='Safe opened!'}else document.querySelector('#status').textContent='No click. Try another target zone.';draw()};draw();</script></body></html>
