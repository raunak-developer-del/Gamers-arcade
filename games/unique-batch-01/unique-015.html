<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Frogger Classic — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Frogger Classic</h1><p>Cross moving traffic and reach the safe bank.</p><canvas id="c" width="480" height="400"></canvas><p>Arrow keys or tap a direction.</p><div><button onclick="move(0,-1)">↑</button><button onclick="move(-1,0)">←</button><button onclick="move(1,0)">→</button><button onclick="move(0,1)">↓</button></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let p={x:240,y:380},cars=Array.from({length:12},(_,i)=>({x:i%6*90,y:270+(i/6|0)*45,v:i%2?2:-2})),done=false;function move(dx,dy){if(done)return;p.x=Math.max(12,Math.min(468,p.x+dx*40));p.y=Math.max(20,Math.min(380,p.y+dy*40));if(p.y<35){done=true;s.textContent='Safe crossing!';}}onkeydown=e=>{let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m)move(...m)};function f(){x.clearRect(0,0,480,400);x.fillStyle='#173d2d';x.fillRect(0,0,480,60);x.fillStyle='#273347';x.fillRect(0,240,480,120);cars.forEach(a=>{a.x+=a.v;if(a.x<-50)a.x=500;if(a.x>500)a.x=-40;x.fillStyle='#ff4fd8';x.fillRect(a.x,a.y,34,18);if(Math.abs(p.y-a.y)<18&&Math.abs(p.x-a.x)<28){p={x:240,y:380};s.textContent='Traffic hit! Try again.'}});x.fillStyle='#a3ff12';x.fillRect(p.x-10,p.y-10,20,20);if(!done)requestAnimationFrame(f)}f();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
