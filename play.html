<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b16"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="arcade-icon.svg" type="image/svg+xml"><title>Play — Gamers' Arcade</title><link rel="stylesheet" href="styles.css"><style>.play-shell{max-width:1040px;margin:auto;padding:28px 20px 65px}.play-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.back{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:1.2px}.play-actions{display:flex;gap:8px}.play-actions button{background:#151b30;color:#e7ebff;border:1px solid #303958;border-radius:8px;padding:9px 12px;font-size:11px}.play-title{font-size:clamp(30px,5vw,52px);letter-spacing:-1.7px;margin:12px 0 7px}.play-desc{color:var(--muted);line-height:1.7;font-size:13px;max-width:750px}.arena{background:linear-gradient(145deg,#11172b,#0b0e1b);border:1px solid #303958;border-radius:17px;padding:18px;margin-top:20px;box-shadow:0 25px 70px #0002}.arena canvas{display:block;width:100%;max-width:700px;margin:auto;background:#070a14;border:1px solid #1d3566;border-radius:10px;touch-action:none}.hud{display:flex;gap:10px;flex-wrap:wrap;color:#aeb8d8;font-size:10px;letter-spacing:1px;margin:0 auto 12px;max-width:700px}.hud span{border:1px solid #2c3552;background:#11172a;border-radius:6px;padding:7px 9px}.play-area{max-width:700px;margin:auto}.text-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:600px;margin:10px auto}.cell{min-height:54px;background:#161b31;border:1px solid #30395c;border-radius:8px;color:#fff;font-size:20px;font-weight:800;cursor:pointer}.cell:hover{border-color:var(--cyan)}.cell.selected{outline:2px solid var(--cyan)}.field{background:#0b0e1b;border:1px solid #333958;border-radius:8px;padding:10px;color:white;font:inherit;max-width:100%}.msg{min-height:24px;color:#c8b0ff;margin:10px 0;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.control-btn{background:#172a42;color:#eaf2ff;border:1px solid #2c73a7;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.actions button:hover,.control-btn:hover{border-color:var(--cyan)}.instructions{font-size:11px;color:#a3a9c6;line-height:1.7}.touch-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px auto 4px;max-width:500px}.touch-controls button{min-width:54px;min-height:44px;border:1px solid #344260;border-radius:9px;background:#151b30;color:#dffaff;font-weight:900;touch-action:none}.touch-controls button:active{background:#1f5360;border-color:var(--cyan)}.play-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.play-meta span{font-size:9px;color:#9da8c7;letter-spacing:1px;border:1px solid #2a3350;padding:7px 9px;border-radius:99px}.pause-overlay{display:none;text-align:center;padding:14px;color:var(--cyan);font-size:12px;letter-spacing:2px}.pause-overlay.show{display:block}.progress-toast{position:fixed;right:18px;bottom:18px;z-index:30;background:#122c2a;border:1px solid #3e766e;border-radius:12px;padding:12px 15px;color:#baffea;font-size:12px;box-shadow:0 10px 40px #0005}.progress-toast[hidden]{display:none}@media(max-width:500px){.arena{padding:9px}.cell{min-height:46px;font-size:16px}.play-shell{padding:20px 12px 45px}.play-title{font-size:32px}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>GAMERS'<b>ARCADE</b></span></a><div class="top-actions"><a class="back" href="index.html#library">← LIBRARY</a><button class="profile-chip" onclick="location.href='index.html#profile-panel'"><span class="avatar">✦</span><span><b>PLAYER PROFILE</b><small>XP & achievements</small></span></button></div></header><main class="play-shell"><div class="play-nav"><a class="back" href="index.html#library">← BACK TO THE ARCADE</a><div class="play-actions"><button id="pause-game" type="button">Ⅱ Pause</button><button id="sound-game" type="button" aria-pressed="false">♫ Sound: Off</button></div></div><p class="eyebrow" id="category"></p><h1 class="play-title" id="title">Loading game…</h1><p class="play-desc" id="desc"></p><div class="play-meta"><span id="game-number">GAME</span><span>LOCAL HIGH SCORES</span><span>PROGRESS SAVES AUTOMATICALLY</span></div><div class="arena"><div class="play-area"><div class="hud"><span id="score">SCORE: 0</span><span id="status">READY</span><span id="best-score">BEST: 0</span><span id="level-display">LEVEL 1</span></div><div id="game-root"></div><div class="pause-overlay" id="pause-overlay">GAME PAUSED — PRESS RESUME TO CONTINUE</div><div id="message" class="msg" aria-live="polite"></div><div class="actions"><button id="restart" type="button">↻ Restart game</button><button id="instructions" type="button">? How to play</button><a class="control-btn" href="index.html#library">Choose another game ↗</a></div><p class="instructions" id="help"></p></div></div><div id="progress-toast" class="progress-toast" hidden></div></main><script src="games-data.js"></script><script src="profile.js"></script><script src="microgames.js"></script><script>document.getElementById('pause-game').addEventListener('click',function(){window.arcadePaused=!window.arcadePaused;this.textContent=window.arcadePaused?'▶ Resume':'Ⅱ Pause';document.getElementById('pause-overlay').classList.toggle('show',window.arcadePaused);document.getElementById('status').textContent=window.arcadePaused?'PAUSED':'PLAYING'});document.querySelectorAll('[data-key]').forEach(button=>{const key=button.dataset.key;const fire=(type)=>window.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true}));button.addEventListener('pointerdown',e=>{e.preventDefault();fire('keydown')});['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,()=>fire('keyup')))});let audioContext=null;window.arcadeSound=false;document.getElementById('sound-game').addEventListener('click',function(){window.arcadeSound=!window.arcadeSound;this.textContent=window.arcadeSound?'♫ Sound: On':'♫ Sound: Off';this.setAttribute('aria-pressed',String(window.arcadeSound));if(window.arcadeSound){try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=660;g.gain.value=.035;o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.08)}catch(e){}}});</script><script>
(()=>{if(window.parent!==window)return;let sent=false;function queueReturnToast(){if(sent)return;sent=true;try{const start=Number(window.arcadeSessionXPStart||0),now=window.ArcadeProfile?Number(window.ArcadeProfile.get().xp||0):start,earned=Math.max(0,now-start),title=document.getElementById('title')?.textContent||'your game';let message;if(earned>0)message='+'+earned+' XP · '+(window.arcadeFirstDiscovery?'New game discovered: ':'Progress saved: ')+title;else message='Session saved · '+title;sessionStorage.setItem('arcadeReturnToast',JSON.stringify({message,at:Date.now()}))}catch(e){}}
window.addEventListener('pagehide',queueReturnToast);document.querySelectorAll('a.back,a[href="index.html#library"]').forEach(a=>a.addEventListener('click',()=>{queueReturnToast()}));
})();
</script><script>
if(window.parent!==window){document.querySelectorAll('a.back,a[href="index.html#library"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();window.parent.postMessage({type:'arcade-close-game-modal'},location.origin)}));const profileButton=document.querySelector('.profile-chip');if(profileButton)profileButton.addEventListener('click',e=>{e.preventDefault();window.parent.postMessage({type:'arcade-open-profile'},location.origin)})}
</script></body></html>
