<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Dungeon Tactics | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Dungeon Tactics</h1><p>Defeat a guard by choosing attack, defend, or potion at the right moment.</p><section class="panel"><h2 id="battle" class="arena"></h2><div class="arena"><button data-act="attack">Attack</button><button data-act="defend">Defend</button><button data-act="potion">Potion</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let hp=20,enemy=18,pots=2,turn=0;function draw(){document.querySelector('#battle').textContent=`Hero ${hp} HP · Guard ${enemy} HP · Potions ${pots}`;document.querySelector('#status').textContent=enemy<=0?'Guard defeated! Dungeon clear.':hp<=0?'Hero fallen. Restart to try again.':'Choose your action.';document.querySelectorAll('[data-act]').forEach(b=>b.disabled=enemy<=0||hp<=0)}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let a=b.dataset.act;turn++;if(a==='attack')enemy-=5+(Math.random()*5|0);if(a==='defend')hp-=Math.max(0,6-4);if(a==='potion'&&pots){hp=Math.min(20,hp+8);pots--}if(enemy>0&&a!=='defend')hp-=Math.max(0,6-((Math.random()*3)|0));draw()});draw();</script></body></html>
