<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Connect Four — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Connect Four</h1><p>Drop discs into columns and connect four horizontally, vertically, or diagonally.</p><div id="board" style="display:grid;grid-template-columns:repeat(7,1fr);max-width:490px"></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const b=document.querySelector('#board'),s=document.querySelector('#status');let A=Array.from({length:6},()=>Array(7).fill('')),t='R',done=false;function draw(){b.innerHTML='';for(let y=0;y<6;y++)for(let x=0;x<7;x++){let q=document.createElement('button');q.style.cssText='aspect-ratio:1;border-radius:50%;padding:0;margin:2px;background:'+(A[y][x]==='R'?'#ff4fd8':A[y][x]==='Y'?'#a3ff12':'#18243a');q.onclick=()=>drop(x);b.append(q)}}function drop(x){if(done)return;let y=5;while(y>=0&&A[y][x])y--;if(y<0)return;A[y][x]=t;for(let [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(let sign of [-1,1]){let a=x+dx*sign,c=y+dy*sign;while(a>=0&&a<7&&c>=0&&c<6&&A[c][a]===t){n++;a+=dx*sign;c+=dy*sign}}if(n>=4){done=true;s.textContent=t+' connects four!'}}if(!done){t=t==='R'?'Y':'R';s.textContent=(t==='R'?'Pink':'Green')+' turn'}draw()}draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
