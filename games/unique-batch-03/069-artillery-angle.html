<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Artillery Angle | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Artillery Angle</h1><p>Set elevation and charge to hit the distant bunker. Wind changes each shot.</p><section class="panel"><canvas id="game" width="420" height="260"></canvas><div class="arena"><label>Angle <input id="angle" type="range" min="10" max="80" value="45"></label><label>Charge <input id="charge" type="range" min="2" max="12" value="8"></label><button id="fire">Fire</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let wind=0;function draw(px=0,py=0){x.fillStyle='#06121e';x.fillRect(0,0,420,260);x.fillStyle='#245c37';x.fillRect(0,220,420,40);x.fillStyle='#ff4c9a';x.fillRect(360,180,35,40);x.fillStyle='#00f5ff';x.fillRect(15,205,30,15);if(px)x.fillRect(px,py,7,7)}document.querySelector('#fire').onclick=()=>{let a=+document.querySelector('#angle').value*Math.PI/180,v=+document.querySelector('#charge').value*14;wind=Math.random()*2-1;let t=345/(v*Math.cos(a)+wind*15),y=205-v*Math.sin(a)*t+4.9*t*t;let x0=15+345;let ok=Math.abs(y-180)<25;draw(x0,Math.max(0,Math.min(220,y)));document.querySelector('#status').textContent=ok?'Direct hit! Bunker destroyed.':`Miss! Wind ${wind>0?'pushes right':'pushes left'}. Adjust angle and charge.`};draw();</script></body></html>
