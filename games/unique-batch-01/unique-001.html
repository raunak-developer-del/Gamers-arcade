<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Neon Needle — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Neon Needle</h1><p>Stop the moving needle inside the green target zone. Timing—not movement—is the core mechanic.</p><canvas id="c" width="640" height="240"></canvas><p>Tap / click STOP when the needle is inside the green zone.</p><button id="stop">STOP</button><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let pos=0,dir=1,playing=true,score=0;function draw(){x.clearRect(0,0,640,240);x.fillStyle='#102033';x.fillRect(30,100,580,35);x.fillStyle='#a3ff12';x.fillRect(280,92,80,51);x.fillStyle='#00f5ff';x.fillRect(30+pos,82,6,70);x.fillStyle='#effcff';x.font='18px system-ui';x.fillText('TARGET ZONE',278,75);if(playing){pos+=dir*5;if(pos>574||pos<0)dir*=-1;requestAnimationFrame(draw)}}draw();function stop(){if(!playing)return;let p=30+pos;if(p>=280&&p<=360){score+=1;s.textContent='PERFECT HIT! Score '+score+'. Try again!';pos=0;}else{s.textContent='Missed! Needle was '+Math.round(p)+'; target is 280–360. Restart for a new run.';playing=false}}document.querySelector('#stop').onclick=stop;c.onclick=stop;</script><script src="../../arcade-juice.js" defer></script></body></html>
