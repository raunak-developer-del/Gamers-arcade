<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Echo Sequence — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Echo Sequence</h1><p>Memorize and repeat a growing sequence of four tones/colors. Memory sequence game, not a matching-pairs game.</p><div id="pads" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button data-n="0" style="height:120px;background:#164e63">CYAN</button><button data-n="1" style="height:120px;background:#581c87">VIOLET</button><button data-n="2" style="height:120px;background:#14532d">GREEN</button><button data-n="3" style="height:120px;background:#7f1d1d">RED</button></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const s=document.querySelector('#status'),pads=[...document.querySelectorAll('[data-n]')];let seq=[],i=0,round=0,locked=true;function flash(n){pads[n].style.filter='brightness(2.4)';setTimeout(()=>pads[n].style.filter='',280)}function next(){seq.push(Math.floor(Math.random()*4));i=0;locked=true;s.textContent='Watch the sequence: round '+(round+1);seq.forEach((n,j)=>setTimeout(()=>flash(n),550*j+300));setTimeout(()=>{locked=false;s.textContent='Repeat '+seq.length+' taps in order.'},550*seq.length+350)}pads.forEach((p,n)=>p.onclick=()=>{if(locked)return;flash(n);if(n!==seq[i]){locked=true;s.textContent='Sequence broken at round '+(round+1)+'. Restart to try again.';return}if(++i===seq.length){round++;if(round===8){locked=true;s.textContent='Amazing! You completed all 8 rounds.'}else setTimeout(next,650)}});next();</script><script src="../../arcade-juice.js" defer></script></body></html>
