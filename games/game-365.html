<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brick Breaker 365 — Gamers' Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050711;color:#eaf2ff;font:16px system-ui,Arial;display:flex;justify-content:center;min-height:100vh}main{width:min(96vw,620px);padding:16px 12px 28px;text-align:center}h1{color:#9cff45;text-shadow:0 0 14px #9cff4580;font-size:clamp(22px,5vw,32px);margin:6px}p{color:#b8c5dc;font-size:14px}canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;background:#070a16;border:2px solid #9cff45;border-radius:12px;touch-action:none}.stats,.buttons{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}.buttons{justify-content:center}button,a{background:#101b2d;color:#eff6ff;border:1px solid #7795bd;border-radius:9px;padding:10px 14px;font-weight:700;text-decoration:none}#msg{min-height:22px;color:#9cff45;font-size:13px}
</style></head><body><main><h1>Brick Breaker 365</h1><p>Break every brick. Move the paddle with your finger or the ◀ ▶ keys.</p>
<div class="stats"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span><span>Level: <b id="level">1</b></span></div>
<canvas id="g" width="480" height="600"></canvas><div id="msg">Tap Start / Launch to play.</div><div class="buttons"><button id="start">Start / Launch</button><button id="restart">Restart</button><a href="../index.html">Game library</a></div></main>
<script>
(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),W=480,H=600;let p,b,br,score,lives,level,run=false,keys={},last=0,raf=0;
const colors=['#ff5577','#ff9d42','#ffe45e','#8df45b','#42e7e7','#8f8bff'];const $=id=>document.getElementById(id);
function make(){br=[];let rows=Math.min(4+level,7),cols=7,gap=7,bw=(W-34-gap*6)/7;for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)br.push({x:17+q*(bw+gap),y:48+r*27,w:bw,h:20,color:colors[r%6],alive:true})}
function ballReset(){b={x:240,y:510,r:8,dx:Math.random()<.5?-3:3,dy:-4};p.x=192}
function init(){score=0;lives=3;level=1;run=false;p={x:192,y:550,w:96,h:12,speed:7};ballReset();make();stat();draw();$('msg').textContent='Tap Start / Launch to play.'}
function stat(){$('score').textContent=score;$('lives').textContent=lives;$('level').textContent=level}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#070a16';x.fillRect(0,0,W,H);x.strokeStyle='#17223a';for(let i=0;i<W;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=30){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
br.forEach(z=>{if(z.alive){x.fillStyle=z.color;x.shadowColor=z.color;x.shadowBlur=8;x.fillRect(z.x,z.y,z.w,z.h);x.shadowBlur=0}});x.fillStyle='#9cff45';x.shadowColor='#9cff45';x.shadowBlur=10;x.fillRect(p.x,p.y,p.w,p.h);x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();x.shadowBlur=0;
if(!run){x.fillStyle='#eaf2ff';x.textAlign='center';x.font='bold 22px system-ui';x.fillText(lives<=0?'GAME OVER':br.every(z=>!z.alive)?'LEVEL COMPLETE':'BRICK BREAKER',240,310);x.font='14px system-ui';x.fillText('Press Start / Launch',240,337)}}
function launch(){if(lives<=0)init();if(br.every(z=>!z.alive)){level++;make();ballReset();stat()}run=true;$('msg').textContent='Playing — break all the bricks!';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(t){if(!run)return;let d=Math.min((t-last)/16.67,2);last=t;if(keys.ArrowLeft||keys.a||keys.A)p.x-=p.speed*d;if(keys.ArrowRight||keys.d||keys.D)p.x+=p.speed*d;p.x=Math.max(0,Math.min(W-p.w,p.x));b.x+=b.dx*d;b.y+=b.dy*d;if(b.x<b.r||b.x>W-b.r)b.dx*=-1;if(b.y<b.r)b.dy=Math.abs(b.dy);
if(b.dy>0&&b.y+b.r>=p.y&&b.y-b.r<=p.y+p.h&&b.x>=p.x&&b.x<=p.x+p.w){b.dy=-Math.abs(b.dy);b.dx=((b.x-p.x-p.w/2)/(p.w/2))*5}
for(const z of br)if(z.alive&&b.x+b.r>z.x&&b.x-b.r<z.x+z.w&&b.y+b.r>z.y&&b.y-b.r<z.y+z.h){z.alive=false;score+=10;b.dy*=-1;break}
if(b.y>H){lives--;stat();run=false;if(lives>0){ballReset();$('msg').textContent='Ball lost — press Start / Launch.'}else $('msg').textContent='Game over — press Restart.'}
if(br.every(z=>!z.alive)){run=false;$('msg').textContent='Level complete — press Start for next level.'}stat();draw();if(run)raf=requestAnimationFrame(loop)}
function pointer(e){let r=c.getBoundingClientRect();p.x=Math.max(0,Math.min(W-p.w,(e.clientX-r.left)/r.width*W-p.w/2))}
c.addEventListener('pointermove',pointer);c.addEventListener('pointerdown',e=>{pointer(e);if(!run&&lives>0)launch()});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!run)launch()});window.addEventListener('keyup',e=>keys[e.key]=false);$('start').onclick=launch;$('restart').onclick=init;init();
})();
</script></body></html>
