<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mahjong Pairs — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Mahjong Pairs</h1><p>Clear the board by matching identical exposed tile pairs.</p><div id="board" style="display:grid;grid-template-columns:repeat(6,1fr);max-width:480px"></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const b=document.querySelector('#board'),s=document.querySelector('#status');let vals=Array.from({length:18},(_,i)=>i%9+1).flatMap(v=>[v,v]).sort(()=>Math.random()-.5),sel=[],gone=new Set();function draw(){b.innerHTML='';vals.forEach((v,i)=>{let q=document.createElement('button');q.style.cssText='aspect-ratio:1;margin:2px;padding:0;font-size:20px';q.textContent=gone.has(i)?'':sel.includes(i)?['','🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏'][v]:'▧';q.disabled=gone.has(i);q.onclick=()=>{if(sel.includes(i))return;sel.push(i);if(sel.length===2){if(vals[sel[0]]===vals[sel[1]]){gone.add(sel[0]);gone.add(sel[1]);s.textContent='Pair matched!'}else s.textContent='Not a match—try again.';sel=[]}draw()};b.append(q)})}draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
