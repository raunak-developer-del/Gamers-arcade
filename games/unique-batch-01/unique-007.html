<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mirror Maze — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Mirror Maze</h1><p>Find a path to the exit in a generated maze. Grid navigation and route planning.</p><canvas id="c" width="480" height="480"></canvas><p>Use arrow keys / WASD or tap an adjacent cell. Reach the glowing exit.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status'),N=12,cell=40;let grid=Array.from({length:N},()=>Array(N).fill(1)),px=0,py=0,done=false;function carve(a,b){grid[b][a]=0;let dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5);for(let [dx,dy] of dirs){let nx=a+dx,ny=b+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&grid[ny][nx]){grid[b+dy/2][a+dx/2]=0;carve(nx,ny)}}}carve(0,0);grid[N-1][N-1]=0;function draw(){x.clearRect(0,0,480,480);for(let y=0;y<N;y++)for(let a=0;a<N;a++){x.fillStyle=grid[y][a]?'#1a2840':'#08111f';x.fillRect(a*cell,y*cell,cell-2,cell-2)}x.fillStyle='#a3ff12';x.fillRect(11*cell+5,11*cell+5,28,28);x.fillStyle='#00f5ff';x.beginPath();x.arc(px*cell+20,py*cell+20,12,0,7);x.fill()}function move(dx,dy){if(done)return;let nx=px+dx,ny=py+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!grid[ny][nx]){px=nx;py=ny;if(px===11&&py===11){done=true;s.textContent='Maze solved!'}draw()}}onkeydown=e=>{let m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[e.key.toLowerCase()];if(m){e.preventDefault();move(...m)}};c.onclick=e=>{let r=c.getBoundingClientRect(),a=Math.floor((e.clientX-r.left)/r.width*N),b=Math.floor((e.clientY-r.top)/r.height*N);if(Math.abs(a-px)+Math.abs(b-py)===1)move(a-px,b-py)};draw();</script><script src="../../arcade-juice.js" defer></script></body></html>
