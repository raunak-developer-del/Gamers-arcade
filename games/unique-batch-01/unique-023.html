<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Sudoku Mini — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Sudoku Mini</h1><p>Fill each row and column with digits 1–4 without repeating.</p><div id="board" style="display:grid;grid-template-columns:repeat(4,1fr);max-width:320px"></div><p>Mini Sudoku: tap an empty cell and enter 1–4.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const b=document.querySelector('#board'),s=document.querySelector('#status');let A=[1,0,0,4,0,4,1,0,0,1,4,0,4,0,0,1],sel=1;function draw(){b.innerHTML='';A.forEach((v,i)=>{let q=document.createElement('button');q.style.cssText='aspect-ratio:1;font-size:26px;margin:2px';q.textContent=v||'·';q.onclick=()=>{sel=i;let n=prompt('Enter 1–4 for this cell (Cancel to leave unchanged)');if(n&&/^[1-4]$/.test(n)){A[i]=+n;draw();if(A.every(Boolean))s.textContent='Grid filled! Check each row and column for duplicates.'}};b.append(q)})}draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
