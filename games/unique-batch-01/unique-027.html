<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Flappy Pulse — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Flappy Pulse</h1><p>Flap through moving gaps without hitting the pipes.</p><canvas id="c" width="400" height="500"></canvas><p>Tap / click / Space to flap.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let y=240,v=0,obs=[{x:430,g:220}],score=0,dead=false;function flap(){if(!dead)v=-6}c.onclick=flap;onkeydown=e=>{if(e.code==='Space')flap()};function f(){x.clearRect(0,0,400,500);if(!dead){v+=.28;y+=v;obs.forEach(o=>o.x-=2);if(obs[obs.length-1].x<230)obs.push({x:430,g:100+Math.random()*280});obs=obs.filter(o=>o.x>-60);obs.forEach(o=>{x.fillStyle='#a3ff12';x.fillRect(o.x,0,48,o.g-65);x.fillRect(o.x,o.g+65,48,500-o.g);if(o.x<55&&o.x+48>35&&(y<o.g-65||y>o.g+65))dead=true;if(o.x===34)score++});if(y<0||y>500)dead=true}x.fillStyle='#00f5ff';x.beginPath();x.arc(45,y,13,0,7);x.fill();s.textContent='Gates passed: '+score+(dead?' · Crash! Restart to retry.':'');if(!dead)requestAnimationFrame(f)}f();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
