<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Dice Forge Five | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Dice Forge Five</h1><p>Roll five dice up to three times. Lock dice you want to keep; aim for five of a kind.</p><section class="panel"><div id="dice" class="arena" style="font-size:2rem"></div><div class="arena"><button id="roll">Roll</button><button id="score">Score turn</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let d=[1,2,3,4,5],keep=new Set(),rolls=0;function draw(){let e=document.querySelector('#dice');e.innerHTML='';d.forEach((v,i)=>{let b=document.createElement('button');b.textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][v];b.style.fontSize='2rem';b.style.background=keep.has(i)?'#14513e':'#101e30';b.onclick=()=>{keep.has(i)?keep.delete(i):keep.add(i);draw()};e.append(b)});document.querySelector('#status').textContent=`Roll ${rolls}/3 · Keep selected dice`}document.querySelector('#roll').onclick=()=>{if(rolls>=3)return;d=d.map((v,i)=>keep.has(i)?v:1+Math.random()*6|0);rolls++;draw()};document.querySelector('#score').onclick=()=>{let counts=d.map(v=>d.filter(x=>x===v).length);document.querySelector('#status').textContent=Math.max(...counts)===5?'YAHTZEE! Five of a kind!':`Score ${d.reduce((a,b)=>a+b,0)} points.`;rolls=0;keep.clear()};draw();</script></body></html>
