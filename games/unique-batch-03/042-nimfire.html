<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Nimfire | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Nimfire</h1><p>Take 1–3 crystals from the pile. Whoever takes the last crystal wins.</p><section class="panel"><h2 id="pile" class="arena" style="font-size:2rem"></h2><div id="moves" class="arena"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let n=17,done=false;function draw(){document.querySelector('#pile').textContent='◆ '.repeat(n);let e=document.querySelector('#moves');e.innerHTML='';[1,2,3].forEach(k=>{let b=document.createElement('button');b.textContent='Take '+k;b.disabled=done||k>n;b.onclick=()=>{n-=k;if(!n){done=true;document.querySelector('#status').textContent='You took the last crystal — victory!'}else{let cpu=Math.min(n,((n-1)%4)||1);n-=cpu;document.querySelector('#status').textContent=`CPU took ${cpu}. Your turn.`;if(!n){done=true;document.querySelector('#status').textContent='CPU took the last crystal. Try again.'}}draw()};e.append(b)});document.querySelector('#pile').textContent='◆ '.repeat(n)+' ('+n+')'}draw();</script></body></html>
