<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Cave Copter | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Cave Copter</h1><p>Hold to rise and release to fall. Fly through the cave without touching its walls.</p><section class="panel"><canvas id="game" width="420" height="360"></canvas><p>Hold the canvas or Space to gain altitude.</p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let y=180,vy=0,obs=[],score=0,dead=false,up=false;function draw(){x.fillStyle='#02040a';x.fillRect(0,0,420,360);x.fillStyle='#17435b';obs.forEach(o=>{x.fillRect(o.x,0,55,o.gap);x.fillRect(o.x,o.gap+100,55,360-o.gap-100)});x.fillStyle='#a3ff12';x.fillRect(65,y,28,18);document.querySelector('#status').textContent=dead?'Copter crashed! Restart to retry.':'Distance '+score}function tick(){if(dead)return;vy+=(up?-.35:.28);y+=vy;if(Math.random()<.025)obs.push({x:430,gap:35+Math.random()*180});obs.forEach(o=>o.x-=3);if(obs[0]?.x<93&&obs[0]?.x>30&&(y<obs[0].gap||y+18>obs[0].gap+100))dead=true;if(y<0||y>342)dead=true;if(obs[0]?.x<-55){obs.shift();score++}draw();requestAnimationFrame(tick)}c.onpointerdown=()=>up=true;c.onpointerup=()=>up=false;document.addEventListener('keydown',e=>{if(e.code==='Space')up=true});document.addEventListener('keyup',e=>{if(e.code==='Space')up=false});tick();</script></body></html>
