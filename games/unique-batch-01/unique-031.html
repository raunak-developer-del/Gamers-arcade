<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pulse Archery — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Pulse Archery</h1><p>Time your shot and aim for the moving target to score bullseyes.</p><canvas id="c" width="480" height="320"></canvas><p>Tap / click to shoot when target moves across the crosshair.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let tx=240,dir=1,shots=0,score=0;function draw(){x.clearRect(0,0,480,320);x.strokeStyle='#41536d';x.beginPath();x.moveTo(20,160);x.lineTo(460,160);x.stroke();x.fillStyle='#ff4fd8';x.beginPath();x.arc(tx,160,26,0,7);x.fill();x.fillStyle='#a3ff12';x.beginPath();x.arc(tx,160,10,0,7);x.fill();x.strokeStyle='#00f5ff';x.beginPath();x.moveTo(240,120);x.lineTo(240,200);x.moveTo(200,160);x.lineTo(280,160);x.stroke();tx+=dir*2.2;if(tx>440||tx<40)dir*=-1;requestAnimationFrame(draw)}c.onclick=()=>{shots++;let d=Math.abs(tx-240);score+=d<12?100:d<30?50:0;s.textContent=(d<12?'Bullseye!':d<30?'Good shot!':'Miss!')+' Score '+score+' · Shots '+shots};draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
