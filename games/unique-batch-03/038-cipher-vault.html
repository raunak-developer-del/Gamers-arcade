<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Cipher Vault | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Cipher Vault</h1><p>Crack the hidden four-colour code. Feedback shows correct colour in the right place and correct colour elsewhere.</p><section class="panel"><p>Choose a 4-symbol code from ● ▲ ■ ◆. Repeats are allowed.</p><div id="guess" class="arena"></div><button id="submit">Submit code</button><ol id="history"></ol><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const sy=['●','▲','■','◆'];let secret=Array.from({length:4},()=>sy[Math.random()*4|0]),guess=Array(4).fill('●'),tries=0;function draw(){let e=document.querySelector('#guess');e.innerHTML='';guess.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{guess[i]=sy[(sy.indexOf(guess[i])+1)%4];draw()};e.append(b)});document.querySelector('#status').textContent=`Attempts: ${tries}/10`}document.querySelector('#submit').onclick=()=>{tries++;let exact=guess.filter((v,i)=>v===secret[i]).length;let a=guess.slice(),s=secret.slice();a.forEach((v,i)=>{if(v===s[i]){a[i]=null;s[i]=null}});let near=a.filter(v=>v&&s.includes(v)).length;let li=document.createElement('li');li.textContent=guess.join(' ')+' — '+exact+' exact, '+near+' misplaced';document.querySelector('#history').prepend(li);if(exact===4){document.querySelector('#status').textContent='Vault cracked!';document.querySelector('#submit').disabled=true}else if(tries>=10){document.querySelector('#status').textContent='Vault locked. Code: '+secret.join(' ');document.querySelector('#submit').disabled=true}draw()};draw();</script></body></html>
