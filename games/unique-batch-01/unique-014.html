<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Breakout Classic — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Breakout Classic</h1><p>Bounce a ball with your paddle to clear a wall of bricks.</p><canvas id="c" width="480" height="360"></canvas><p>Move mouse or touch to control paddle.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let px=210,b={x:240,y:260,vx:2.5,vy:-3},br=Array.from({length:35},(_,i)=>({x:8+i%7*67,y:25+(i/7|0)*24,on:true})),dead=false;c.onpointermove=e=>{let r=c.getBoundingClientRect();px=(e.clientX-r.left)/r.width*480-40};function f(){x.clearRect(0,0,480,360);if(dead)return; b.x+=b.vx;b.y+=b.vy;if(b.x<5||b.x>475)b.vx*=-1;if(b.y<5)b.vy*=-1;if(b.y>315&&b.x>px&&b.x<px+80)b.vy=-Math.abs(b.vy);if(b.y>360){dead=true;s.textContent='Ball lost. Bricks left: '+br.filter(q=>q.on).length;return}br.forEach(q=>{if(q.on&&b.x>q.x&&b.x<q.x+60&&b.y>q.y&&b.y<q.y+16){q.on=false;b.vy*=-1}});br.forEach(q=>{if(q.on){x.fillStyle='#ff4fd8';x.fillRect(q.x,q.y,60,16)}});x.fillStyle='#00f5ff';x.fillRect(px,325,80,9);x.fillStyle='#a3ff12';x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill();if(!br.some(q=>q.on)){dead=true;s.textContent='All bricks destroyed!';return}requestAnimationFrame(f)}f();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
