<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Space Invaders — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Space Invaders</h1><p>Move your ship and shoot descending alien waves.</p><canvas id="c" width="480" height="360"></canvas><p>← → move · Space shoot · tap canvas to shoot</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let ship=240,aliens=Array.from({length:15},(_,i)=>({x:30+i%5*80,y:35+(i/5|0)*32})),shots=[],dir=1,score=0,keys={};onkeydown=e=>keys[e.key]=true;onkeyup=e=>keys[e.key]=false;c.onclick=()=>shots.push({x:ship,y:300});function frame(){x.clearRect(0,0,480,360);if(keys.ArrowLeft)ship-=4;if(keys.ArrowRight)ship+=4;if(keys[' ']){if(!frame.last||Date.now()-frame.last>250){shots.push({x:ship,y:300});frame.last=Date.now()}}ship=Math.max(10,Math.min(470,ship));aliens.forEach(a=>{a.x+=dir*.35;if(a.x>465||a.x<15)dir*=-1});shots.forEach(b=>b.y-=5);shots=shots.filter(b=>b.y>0);for(let i=aliens.length-1;i>=0;i--)for(let j=shots.length-1;j>=0;j--)if(Math.hypot(aliens[i].x-shots[j].x,aliens[i].y-shots[j].y)<18){aliens.splice(i,1);shots.splice(j,1);score+=10;break}x.fillStyle='#00f5ff';x.fillRect(ship-12,320,24,14);x.fillStyle='#ff4fd8';aliens.forEach(a=>x.fillRect(a.x-10,a.y-8,20,16));x.fillStyle='#a3ff12';shots.forEach(b=>x.fillRect(b.x-2,b.y,4,10));s.textContent='Score '+score+' · Aliens '+aliens.length;if(aliens.length)requestAnimationFrame(frame);else s.textContent='Wave cleared! Score '+score}frame();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
