<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Drawbridge Engineer — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Drawbridge Engineer</h1><p>Draw a bridge line to connect two platforms and guide the cart across.</p><canvas id="c" width="480" height="320"></canvas><p>Drag to draw a bridge between the ledges, then press TEST.</p><button id="test">TEST BRIDGE</button><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let pts=[],drawing=false;c.onpointerdown=e=>{drawing=true;pts=[];let r=c.getBoundingClientRect();pts.push({x:(e.clientX-r.left)/r.width*480,y:(e.clientY-r.top)/r.height*320})};c.onpointermove=e=>{if(!drawing)return;let r=c.getBoundingClientRect();pts.push({x:(e.clientX-r.left)/r.width*480,y:(e.clientY-r.top)/r.height*320});draw()};c.onpointerup=()=>drawing=false;function draw(){x.clearRect(0,0,480,320);x.fillStyle='#34445c';x.fillRect(0,220,150,100);x.fillRect(330,220,150,100);x.fillStyle='#a3ff12';x.fillRect(45,200,60,20);x.fillRect(375,200,60,20);x.strokeStyle='#00f5ff';x.lineWidth=5;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}document.querySelector('#test').onclick=()=>{let start=pts.some(p=>p.x<160&&p.y>175&&p.y<250),end=pts.some(p=>p.x>320&&p.y>175&&p.y<250);s.textContent=start&&end&&pts.length>5?'Bridge connected! The cart can cross.':'Bridge must touch both ledges. Draw a continuous line.'};draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
