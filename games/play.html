<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070711"><title>Gamers’ Arcade — Play</title>
<style>:root{--accent:#00f5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#111a3b,#05070e 70%);color:#effcff;font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:14px}.wrap{width:min(100%,560px)}h1{font-size:clamp(21px,5vw,29px);margin:0 0 5px;color:var(--accent);text-shadow:0 0 16px var(--accent)}p{color:#b8c8df;margin:0 0 10px;font-size:14px;line-height:1.45}canvas{display:block;width:100%;height:auto;aspect-ratio:480/520;background:#071027;border:2px solid var(--accent);border-radius:16px;box-shadow:0 0 24px #071b35;touch-action:none}#status{min-height:36px;color:#a3ffb4;padding:9px 2px;font-size:13px}.controls{display:flex;gap:9px;flex-wrap:wrap}a,button{border:1px solid var(--accent);color:#effcff;background:#101729;border-radius:11px;padding:10px 14px;text-decoration:none;font-weight:750;font-size:14px}button{cursor:pointer}small{display:block;color:#7189a5;margin-top:10px;line-height:1.5}.tag{color:#8da6c9;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}</style></head>
<body><main class="wrap"><div class="tag" id="tierTag">Gamers’ Arcade · 500 playable challenges</div><h1 id="gameTitle">Loading game…</h1><p id="gameDescription">Loading objective…</p><canvas id="game" width="480" height="520" aria-label="Arcade game"></canvas><div id="status">Loading game engine…</div><div class="controls"><button id="restart" type="button">↻ Restart game</button><a href="index.html#library">← Game library</a></div><small>Progress is saved in this browser when the shared profile script is available.</small></main>
<script src="game-catalog.js"></script><script>const params=new URLSearchParams(location.search);const id=Math.max(1,Math.min(500,Number(params.get('id'))||1));window.GAME_CONFIG=window.ARCADE_GAME_CATALOG[String(id)]||window.ARCADE_GAME_CATALOG['1'];document.getElementById('gameDescription').innerHTML=window.GAME_CONFIG.description+'<br>Difficulty '+window.GAME_CONFIG.difficulty+' · '+({collect:'Move with touch or WASD/arrows. Collect green gems; avoid pink hazards.',dodge:'Move with touch or WASD/arrows. Survive until the timer ends.',shooter:'Move with touch or WASD/arrows; hold Space to fire at targets.',target:'Tap/click the glowing targets before they escape.',racer:'Tap a lane or use left/right arrows to switch lanes.',runner:'Tap or press Space/Up to jump over barriers.',orbit:'Use left/right arrows or A/D to orbit around the core.',pong:'Move the paddle with touch or left/right arrows.',breakout:'Move the paddle with touch or left/right arrows; clear every brick.',memory:'Tap/click two cards at a time to find matching pairs.',math:'Tap/click the correct answer for each arithmetic question.',maze:'Use WASD/arrows or tap an adjacent open tile to reach the exit.',snake:'Steer with WASD/arrows; eat energy cells and avoid your tail.',reaction:'Tap/click the highlighted green tile as quickly as possible.',flood:'Choose a colour along the bottom to flood the board.',tactics:'Tap/click an empty square. Make three in a row before the opponent.',pattern:'Watch the sequence, then tap the matching quadrants in order.',tower:'Tap or press Space to drop each moving platform.',lights:'Tap/click a light; it and its neighbours toggle. Turn all lights off.',word:'Tap/click the correctly unscrambled word.',platformer:'Tap or press Space/Up to jump across gaps and reach the finish.',rhythm:'Press the displayed lane key (D/F/J/K) when the beat arrives.',sort:'Tap a lane to guide falling shapes into matching colour bins.',defense:'Move with touch or WASD/arrows; hold Space to shoot drones before they reach the core.',bridge:'Tap tiles to rotate them; make the middle row a continuous horizontal power path.'})[window.GAME_CONFIG.kind]+' · Touch and keyboard support where appropriate.';document.getElementById('tierTag').textContent='GAME '+String(id).padStart(3,'0')+' OF 500 · TIER '+window.GAME_CONFIG.tier+' · CHALLENGE ×'+window.GAME_CONFIG.multiplier;</script><script src="profile.js"></script><script src="arcade-engine.js"></script></body></html>
