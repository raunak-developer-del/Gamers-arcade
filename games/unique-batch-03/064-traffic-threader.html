<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Traffic Threader | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Traffic Threader</h1><p>Switch lanes to avoid traffic for as long as possible.</p><section class="panel"><canvas id="game" width="360" height="480"></canvas><div class="arena"><button id="left">Lane ◀</button><button id="right">Lane ▶</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let lane=1,obs=[],score=0,dead=false;function draw(){x.fillStyle='#222831';x.fillRect(0,0,360,480);x.strokeStyle='#eee';x.setLineDash([15,15]);x.beginPath();x.moveTo(120,0);x.lineTo(120,480);x.moveTo(240,0);x.lineTo(240,480);x.stroke();x.setLineDash([]);obs.forEach(o=>{x.fillStyle='#ff4c9a';x.fillRect(o.l*120+35,o.y,50,70)});x.fillStyle='#00f5ff';x.fillRect(lane*120+35,390,50,70);document.querySelector('#status').textContent=dead?'Crash! Restart to retry.':'Dodged '+score+' traffic blocks'}function tick(){if(dead)return;if(Math.random()<.035)obs.push({l:Math.random()*3|0,y:-70});obs.forEach(o=>o.y+=4);let hit=obs.some(o=>o.l===lane&&o.y+70>390&&o.y<460);if(hit)dead=true;let before=obs.length;obs=obs.filter(o=>o.y<480);score+=before-obs.length;draw();requestAnimationFrame(tick)}document.querySelector('#left').onclick=()=>lane=Math.max(0,lane-1);document.querySelector('#right').onclick=()=>lane=Math.min(2,lane+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')lane=Math.max(0,lane-1);if(e.key==='ArrowRight')lane=Math.min(2,lane+1)});tick();</script></body></html>
