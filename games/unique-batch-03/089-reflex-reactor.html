<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Reflex Reactor | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Reflex Reactor</h1><p>Tap only when the signal turns green. False starts cost a life.</p><section class="panel"><button id="signal" style="width:100%;height:160px;font-size:2rem">Wait for green…</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let phase='wait',timer,score=0,lives=3,at=0;const b=document.querySelector('#signal');function wait(){phase='wait';b.textContent='Wait for green…';b.style.background='#922';timer=setTimeout(()=>{phase='go';at=performance.now();b.textContent='TAP NOW!';b.style.background='#14513e'},800+Math.random()*2500)}b.onclick=()=>{if(phase==='wait'){lives--;document.querySelector('#status').textContent='False start! Lives '+lives;if(lives<=0){b.disabled=true;return}clearTimeout(timer);wait()}else{score++;document.querySelector('#status').textContent=`Reaction ${Math.round(performance.now()-at)} ms · Score ${score}`;clearTimeout(timer);wait()}};wait();</script></body></html>
