<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Candy Crush — Gamers' Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;text-align:center;padding:16px}h1{color:#ff71c8;text-shadow:0 0 14px #ff71c8}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(94vw,440px);margin:14px auto;padding:8px;background:#151b31;border:1px solid #ff71c8;border-radius:14px;touch-action:manipulation}.cell{aspect-ratio:1;border:0;border-radius:10px;font-size:clamp(19px,5vw,32px);padding:0;background:#202944;box-shadow:inset 0 -3px 0 #0004}.cell.selected{outline:3px solid white;transform:scale(.92)}button,a{background:#111a2c;color:#fff;border:1px solid #ff71c8;border-radius:10px;padding:10px 14px;font-weight:bold;text-decoration:none}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}small{color:#9db5cb}</style></head><body><h1>🍬 Candy Crush</h1><p>Tap two adjacent candies to swap. Match 3 or more to score!</p><p>Score: <b id="score">0</b> · Moves: <b id="moves">0</b></p><div class="board" id="board"></div><div class="row"><button onclick="start()">New game</button><a href="../index.html">Game library</a></div><p id="msg">Choose a candy to begin.</p><small>Gamers' Arcade · match-three mini-game</small><script>const board=document.getElementById('board'),colors=['🍓','🍋','🍇','🍊','🫐','🍏'];let grid=[],first=null,score=0,moves=0;function rand(){return Math.floor(Math.random()*colors.length)}function start(){grid=Array.from({length:8},()=>Array.from({length:8},rand));score=0;moves=0;first=null;while(findMatches().length)for(let [r,c] of findMatches())grid[r][c]=rand();render();say('Match three or more!')}function findMatches(){let set=new Set();for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(c<6&&grid[r][c]===grid[r][c+1]&&grid[r][c]===grid[r][c+2]){let k=c;while(k<8&&grid[r][k]===grid[r][c]){set.add(r*8+k);k++}}if(r<6&&grid[r][c]===grid[r+1][c]&&grid[r][c]===grid[r+2][c]){let k=r;while(k<8&&grid[k][c]===grid[r][c]){set.add(k*8+c);k++}}}return [...set].map(n=>[Math.floor(n/8),n%8])}function render(){board.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let b=document.createElement('button');b.className='cell'+(first&&first[0]===r&&first[1]===c?' selected':'');b.textContent=colors[grid[r][c]];b.setAttribute('aria-label','Candy');b.onclick=()=>tap(r,c);board.appendChild(b)}document.getElementById('score').textContent=score;document.getElementById('moves').textContent=moves}function tap(r,c){if(!first){first=[r,c];render();return}let [a,b]=first;first=null;if(Math.abs(a-r)+Math.abs(b-c)!==1){first=[r,c];render();return}[grid[a][b],grid[r][c]]=[grid[r][c],grid[a][b]];let m=findMatches();if(!m.length){[grid[a][b],grid[r][c]]=[grid[r][c],grid[a][b]];say('No match—try adjacent candies.');render();return}moves++;resolve();render();say('Nice match!')}function resolve(){let loops=0;while(loops++<20){let m=findMatches();if(!m.length)break;score+=m.length*10;for(let [r,c] of m)grid[r][c]=-1;for(let c=0;c<8;c++){let vals=[];for(let r=7;r>=0;r--)if(grid[r][c]>=0)vals.push(grid[r][c]);while(vals.length<8)vals.push(rand());for(let r=7,i=0;r>=0;r--,i++)grid[r][c]=vals[i]}}}function say(t){document.getElementById('msg').textContent=t}start();</script></body></html>
