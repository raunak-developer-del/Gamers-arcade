<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Asteroids Drift — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Asteroids Drift</h1><p>Rotate, thrust, and shoot to break apart drifting asteroids.</p><canvas id="c" width="480" height="360"></canvas><p>← → rotate · ↑ thrust · Space shoot</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let p={x:240,y:180,a:0,vx:0,vy:0},rocks=Array.from({length:7},()=>({x:Math.random()*480,y:Math.random()*360,vx:Math.random()*2-1,vy:Math.random()*2-1,r:18})),shots=[],keys={};onkeydown=e=>keys[e.key]=true;onkeyup=e=>keys[e.key]=false;function f(){x.clearRect(0,0,480,360);if(keys.ArrowLeft)p.a-=.06;if(keys.ArrowRight)p.a+=.06;if(keys.ArrowUp){p.vx+=Math.cos(p.a)*.08;p.vy+=Math.sin(p.a)*.08}p.x=(p.x+p.vx+480)%480;p.y=(p.y+p.vy+360)%360;if(keys[' ']&&(!f.last||Date.now()-f.last>220)){shots.push({x:p.x,y:p.y,vx:Math.cos(p.a)*5,vy:Math.sin(p.a)*5});f.last=Date.now()}shots.forEach(q=>{q.x+=q.vx;q.y+=q.vy});shots=shots.filter(q=>q.x>=0&&q.x<480&&q.y>=0&&q.y<360);rocks.forEach(r=>{r.x=(r.x+r.vx+480)%480;r.y=(r.y+r.vy+360)%360;x.strokeStyle='#ff4fd8';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()});for(let i=rocks.length-1;i>=0;i--)for(let j=shots.length-1;j>=0;j--)if(Math.hypot(rocks[i].x-shots[j].x,rocks[i].y-shots[j].y)<rocks[i].r){rocks.splice(i,1);shots.splice(j,1);break}x.fillStyle='#00f5ff';x.save();x.translate(p.x,p.y);x.rotate(p.a);x.beginPath();x.moveTo(16,0);x.lineTo(-10,-9);x.lineTo(-6,0);x.lineTo(-10,9);x.closePath();x.fill();x.restore();shots.forEach(q=>{x.fillStyle='#a3ff12';x.fillRect(q.x,q.y,3,3)});s.textContent='Asteroids remaining: '+rocks.length;if(rocks.length)requestAnimationFrame(f);else s.textContent='Sector cleared!'}f();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
