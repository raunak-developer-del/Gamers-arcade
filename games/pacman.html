<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pac-Man — Gamers' Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;text-align:center;padding:16px}h1{color:#ffe600;text-shadow:0 0 14px #ffe600}canvas{width:min(94vw,480px);height:auto;background:#030510;border:2px solid #456dff;border-radius:12px;touch-action:none}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}button,a{background:#111a2c;color:#fff;border:1px solid #67b7ff;border-radius:10px;padding:10px 14px;font-weight:bold;text-decoration:none}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:5px;justify-content:center;margin:10px}.pad button{padding:12px 0}small{color:#9db5cb}</style><link rel="stylesheet" href="../arcade-juice.css"></head><body><h1>Pac-Man</h1><p>Eat all the dots. Avoid the ghost! Use arrow keys/WASD or the buttons.</p><p>Score: <b id="score">0</b> · <span id="status">Ready!</span></p><canvas id="c" width="420" height="462"></canvas><div class="pad"><span></span><button onclick="move(0,-1)">▲</button><span></span><button onclick="move(-1,0)">◀</button><button onclick="move(0,1)">▼</button><button onclick="move(1,0)">▶</button></div><div class="row"><button onclick="reset()">Restart</button><a href="../index.html">Game library</a></div><small>Gamers' Arcade · standalone Pac-Man mini-game</small><script>
const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');const tile=30,cols=14,rows=15;let map,px,py,dx,dy,score,ghost,timer,done;function reset(){map=Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,col)=>(r===0||col===0||r===rows-1||col===cols-1||((r%4===0)&&(col>2&&col<cols-3)&&col%3!==0)?1:0));px=1;py=1;dx=1;dy=0;score=0;ghost={x:12,y:13};done=false;map[1][1]=0;scoreEl.textContent=score;statusEl.textContent='Go!';draw();clearInterval(timer);timer=setInterval(tick,155)}function move(a,b){if(!done){dx=a;dy=b;}}function tick(){if(done)return;let nx=px+dx,ny=py+dy;if(map[ny]?.[nx]===0){px=nx;py=ny;if(map[py][px]===2){score+=10;map[py][px]=0;scoreEl.textContent=score}}let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[ghost.x+a,ghost.y+b]).filter(([a,b])=>map[b]?.[a]===0);if(opts.length){opts.sort((u,v)=>(Math.abs(u[0]-px)+Math.abs(u[1]-py))-(Math.abs(v[0]-px)+Math.abs(v[1]-py)));let g=opts[Math.random()<.22&&opts.length>1?1:0];ghost.x=g[0];ghost.y=g[1]}if(px===ghost.x&&py===ghost.y){done=true;statusEl.textContent='Caught! Restart to try again.'}if(!map.some(row=>row.includes(2))){done=true;statusEl.textContent='You win!'}draw()}function draw(){x.clearRect(0,0,c.width,c.height);for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){let v=map[r][col],xx=col*tile,yy=r*tile;if(v===1){x.fillStyle='#162d9a';x.fillRect(xx+1,yy+1,tile-2,tile-2);x.strokeStyle='#4f7cff';x.strokeRect(xx+2,yy+2,tile-4,tile-4)}else{x.fillStyle='#070a18';x.fillRect(xx,yy,tile,tile);if(v===2){x.fillStyle='#fff2a6';x.beginPath();x.arc(xx+15,yy+15,3,0,7);x.fill()}}}x.fillStyle='#ffe600';x.beginPath();x.arc(px*tile+15,py*tile+15,12,.25,Math.PI*2-.25);x.lineTo(px*tile+15,py*tile+15);x.fill();x.fillStyle='#ff4b83';x.beginPath();x.arc(ghost.x*tile+15,ghost.y*tile+15,12,Math.PI,0);x.lineTo(ghost.x*tile+27,ghost.y*tile+25);x.lineTo(ghost.x*tile+21,ghost.y*tile+21);x.lineTo(ghost.x*tile+15,ghost.y*tile+25);x.lineTo(ghost.x*tile+9,ghost.y*tile+21);x.lineTo(ghost.x*tile+3,ghost.y*tile+25);x.fill();x.fillStyle='#fff';x.fillRect(ghost.x*tile+8,ghost.y*tile+8,4,5);x.fillRect(ghost.x*tile+18,ghost.y*tile+8,4,5);}
// Add dots to every open tile.
const oldReset=reset;reset=function(){oldReset();for(let r=1;r<rows-1;r++)for(let col=1;col<cols-1;col++)if(map[r][col]===0&&(r!==1||col!==1)&&(r!==13||col!==12))map[r][col]=2;map[1][1]=0;draw()};document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d=({arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]})[k];if(d){e.preventDefault();move(...d)}});reset();</script><script src="../arcade-juice.js" defer></script></body></html>
