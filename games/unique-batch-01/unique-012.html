<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Snake Classic — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Snake Classic</h1><p>Steer a growing snake to eat food without hitting walls or its own body.</p><canvas id="c" width="400" height="400"></canvas><p>Arrow keys / WASD to steer. Tap direction buttons for touch.</p><div><button onclick="turn(0,-1)">↑</button><button onclick="turn(-1,0)">←</button><button onclick="turn(1,0)">→</button><button onclick="turn(0,1)">↓</button></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}],d={x:1,y:0},food={x:12,y:9},score=0,dead=false;function turn(a,b){if(a!==-d.x||b!==-d.y)d={x:a,y:b}}onkeydown=e=>{let m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[e.key.toLowerCase()];if(m)turn(...m)};function tick(){if(dead)return;let h={x:snake[0].x+d.x,y:snake[0].y+d.y};if(h.x<0||h.x>=20||h.y<0||h.y>=20||snake.some(q=>q.x===h.x&&q.y===h.y)){dead=true;s.textContent='Crash! Score '+score;return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.random()*20|0,y:Math.random()*20|0};s.textContent='Food eaten: '+score}else snake.pop();x.clearRect(0,0,400,400);x.fillStyle='#ff4fd8';x.fillRect(food.x*20,food.y*20,18,18);snake.forEach((q,i)=>{x.fillStyle=i?'#168ca0':'#00f5ff';x.fillRect(q.x*20,q.y*20,18,18)});setTimeout(tick,130)}tick();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
