<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080812">
  <title>Leaderboard | Gamers' Arcade</title>
  <style>
    :root { --bg:#080812; --panel:#121225; --cyan:#00f5ff; --purple:#a855f7; --text:#f5f5ff; --muted:#aaaac5; --border:rgba(0,245,255,.25); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#20103c 0%,transparent 55%),var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 6%; border-bottom:1px solid var(--border); background:rgba(8,8,18,.85); }
    .logo { color:var(--cyan); font-weight:900; font-size:1.2rem; text-decoration:none; text-shadow:0 0 14px rgba(0,245,255,.45); }
    nav { display:flex; flex-wrap:wrap; gap:16px; }
    nav a { color:var(--muted); text-decoration:none; font-size:.9rem; }
    nav a:hover { color:var(--cyan); }
    main { width:min(900px,92%); margin:48px auto; }
    .hero { text-align:center; margin-bottom:32px; }
    .eyebrow { color:var(--purple); text-transform:uppercase; letter-spacing:3px; font-size:.75rem; font-weight:800; }
    h1 { margin:10px 0; font-size:clamp(2rem,7vw,3.6rem); line-height:1.1; }
    h1 span { color:var(--cyan); text-shadow:0 0 24px rgba(0,245,255,.35); }
    .subtitle { color:var(--muted); line-height:1.6; }
    .panel { padding:22px; border:1px solid var(--border); border-radius:20px; background:rgba(18,18,37,.92); box-shadow:0 0 35px rgba(168,85,247,.08); }
    .panel-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
    h2 { font-size:1.15rem; margin:0; }
    .live-label { color:var(--cyan); font-size:.75rem; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; text-align:left; }
    th { color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:1px; padding:14px 10px; }
    td { padding:17px 10px; border-top:1px solid rgba(255,255,255,.07); }
    tbody tr:hover { background:rgba(0,245,255,.04); }
    .rank { color:var(--cyan); font-weight:900; }
    .top-rank { color:#facc15; }
    .score { color:var(--cyan); font-weight:800; font-variant-numeric:tabular-nums; }
    #status { color:var(--muted); text-align:center; padding:28px 10px; line-height:1.6; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:24px; }
    .btn { display:inline-block; padding:12px 18px; border:1px solid var(--cyan); border-radius:10px; background:transparent; color:var(--cyan); text-decoration:none; font-weight:750; cursor:pointer; }
    .btn.primary { background:var(--cyan); color:#080812; }
    .btn:hover { box-shadow:0 0 20px rgba(0,245,255,.22); }
    footer { padding:28px 16px; color:var(--muted); text-align:center; font-size:.85rem; }
    @media(max-width:520px) { header { align-items:flex-start; flex-direction:column; } main { margin-top:32px; } .panel { padding:14px 10px; } th,td { padding:13px 7px; font-size:.85rem; } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./index.html">🎮 GAMERS' ARCADE</a>
    <nav aria-label="Main navigation">
      <a href="./index.html">Home</a>
      <a href="./play.html">Play</a>
      <a href="./profile.html">Profile</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow">Global Rankings</div>
      <h1>Hall of <span>Gamers</span></h1>
      <p class="subtitle">Play hard. Score big. Claim your place on the leaderboard.</p>
    </section>
    <section class="panel" aria-labelledby="ranking-title">
      <div class="panel-heading">
        <h2 id="ranking-title">🏆 Top 50 Players</h2>
        <span class="live-label">● ARCADE SCORES</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Score</th></tr></thead>
          <tbody id="leaderboard"><tr><td colspan="3" id="status">Loading leaderboard...</td></tr></tbody>
        </table>
      </div>
    </section>
    <div class="actions">
      <a class="btn primary" href="./index.html">🎮 Play Games</a>
      <button class="btn" id="refresh-button" type="button">↻ Refresh Scores</button>
    </div>
  </main>
  <footer>© Gamers' Arcade · Every score is another legend in the making.</footer>
  <script type="module">
    import { supabase } from './supabase.js';
    const leaderboard = document.getElementById('leaderboard');
    const refreshButton = document.getElementById('refresh-button');

    function showStatus(message) {
      leaderboard.replaceChildren();
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 3;
      cell.id = 'status';
      cell.textContent = message;
      row.appendChild(cell);
      leaderboard.appendChild(row);
    }

    function formatScore(score) {
      const number = Number(score);
      return Number.isFinite(number) ? Math.trunc(number).toLocaleString('en-IN') : '—';
    }

    async function loadLeaderboard() {
      refreshButton.disabled = true;
      showStatus('Loading scores...');
      try {
        const { data, error } = await supabase
          .from('arcade_scores')
          .select('username, score')
          .order('score', { ascending: false })
          .limit(50);
        if (error) throw error;
        if (!data || data.length === 0) {
          showStatus('No scores yet. Play a game and be the first!');
          return;
        }
        leaderboard.replaceChildren();
        data.forEach((entry, index) => {
          const row = document.createElement('tr');
          const rankCell = document.createElement('td');
          rankCell.className = index < 3 ? 'rank top-rank' : 'rank';
          rankCell.textContent = ['🥇', '🥈', '🥉'][index] ?? `#${index + 1}`;
          const playerCell = document.createElement('td');
          playerCell.textContent = entry.username || 'Player';
          const scoreCell = document.createElement('td');
          scoreCell.className = 'score';
          scoreCell.textContent = formatScore(entry.score);
          row.append(rankCell, playerCell, scoreCell);
          leaderboard.appendChild(row);
        });
      } catch (error) {
        console.error('Leaderboard error:', error);
        showStatus('Unable to load scores. Check your connection, table columns, and Supabase read permissions.');
      } finally {
        refreshButton.disabled = false;
      }
    }
    refreshButton.addEventListener('click', loadLeaderboard);
    loadLeaderboard();
  </script>
</body>
</html>
