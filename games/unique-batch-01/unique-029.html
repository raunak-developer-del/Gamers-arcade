<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Gravity Flip — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Gravity Flip</h1><p>Flip gravity to move between floor and ceiling while avoiding obstacles.</p><canvas id="c" width="480" height="280"></canvas><p>Tap / Space to flip gravity.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let y=140,vy=0,g=1,obs=[{x:500,h:65},{x:760,h:95}],score=0,dead=false;function flip(){g*=-1}c.onclick=flip;onkeydown=e=>{if(e.code==='Space')flip()};function f(){x.clearRect(0,0,480,280);if(!dead){vy+=g*.22;y+=vy;obs.forEach(o=>o.x-=2.3);if(obs[obs.length-1].x<300)obs.push({x:520,h:40+Math.random()*100});obs=obs.filter(o=>o.x>-30);if(y<12||y>268)dead=true;obs.forEach(o=>{let top=g>0?0:280-o.h,hh=o.h;if(45>o.x-10&&45<o.x+24&&((g>0&&y<o.h)||(g<0&&y>280-o.h)))dead=true;x.fillStyle='#ff4fd8';x.fillRect(o.x,top,24,hh)});score++}x.fillStyle='#00f5ff';x.fillRect(35,y-10,20,20);s.textContent='Distance '+score+(dead?' · Collision!':'');if(!dead)requestAnimationFrame(f)}f();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
