<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Checkers — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Checkers</h1><p>Capture opposing pieces by jumping diagonally; reach the far edge to crown kings.</p><div id="board" style="display:grid;grid-template-columns:repeat(8,1fr);max-width:520px"></div><p>Tap your piece, then its diagonal destination. Local two-player.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const b=document.querySelector('#board'),s=document.querySelector('#status');let A=Array(64).fill('');for(let y=0;y<3;y++)for(let x=0;x<8;x++)if((x+y)%2)A[y*8+x]='b';for(let y=5;y<8;y++)for(let x=0;x<8;x++)if((x+y)%2)A[y*8+x]='r';let turn='r',sel=-1;function draw(){b.innerHTML='';A.forEach((p,i)=>{let q=document.createElement('button');q.style.cssText=`aspect-ratio:1;margin:0;padding:0;border-radius:0;background:${(i%8+(i/8|0))%2?'#25344b':'#a9b8c8'};color:${p==='r'?'#ff4fd8':'#00f5ff'};font-size:clamp(18px,4vw,30px);outline:${sel===i?'3px solid #a3ff12':'none'}`;q.textContent=p?(p==='r'?'●':p==='b'?'●':p==='R'?'♛':'♛'):'';q.onclick=()=>click(i);b.append(q)})}function click(i){if(sel<0){if(A[i].toLowerCase()===turn){sel=i;draw()}return}let dx=i%8-sel%8,dy=(i/8|0)-(sel/8|0),p=A[sel],king=p!==p.toLowerCase(),forward=turn==='r'?-1:1,valid=Math.abs(dx)===1&&Math.abs(dy)===1&&!A[i]&&(king||dy===forward),jump=Math.abs(dx)===2&&Math.abs(dy)===2&&!A[i]&&A[(sel/8|0)+dy/2*8+(sel%8+dx/2)]&&A[(sel/8|0)+dy/2*8+(sel%8+dx/2)].toLowerCase()!==turn&&(king||dy===2*forward);if(valid||jump){A[i]=p;A[sel]='';if(jump)A[(sel/8|0)+dy/2*8+(sel%8+dx/2)]='';if(turn==='r'&&i<8)A[i]='R';if(turn==='b'&&i>=56)A[i]='B';turn=turn==='r'?'b':'r';s.textContent=(turn==='r'?'Pink':'Cyan')+' to move.'}sel=-1;draw()}draw();</script></main><script src="../../arcade-juice.js" defer></script></body></html>
