<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Cargo Bay Tetris | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Cargo Bay Tetris</h1><p>Load cargo crates into a ship with limited capacity without exceeding the weight limit.</p><section class="panel"><p>Ship capacity: 20 units</p><div id="cargo" class="arena"></div><p id="load"></p><button id="launch">Launch ship</button><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let weights=[3,7,4,9,6,2],loaded=new Set();function draw(){let e=document.querySelector('#cargo');e.innerHTML='';weights.forEach((w,i)=>{let b=document.createElement('button');b.textContent=`Crate ${i+1} (${w})`;b.style.background=loaded.has(i)?'#14513e':'#101e30';b.onclick=()=>{loaded.has(i)?loaded.delete(i):loaded.add(i);draw()};e.append(b)});let sum=[...loaded].reduce((a,i)=>a+weights[i],0);document.querySelector('#load').textContent='Loaded weight: '+sum+'/20';document.querySelector('#status').textContent=sum===20?'Perfect load!':sum>20?'Over capacity!':'Choose crates to fill exactly 20.'}document.querySelector('#launch').onclick=()=>{let sum=[...loaded].reduce((a,i)=>a+weights[i],0);document.querySelector('#status').textContent=sum===20?'Cargo launched successfully!':'Manifest rejected — exact capacity required.'};draw();</script></body></html>
