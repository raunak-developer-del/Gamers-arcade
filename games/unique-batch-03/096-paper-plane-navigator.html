<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Paper Plane Navigator | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Paper Plane Navigator</h1><p>Adjust pitch to glide through rings while managing altitude and speed.</p><section class="panel"><canvas id="game" width="420" height="280"></canvas><div class="arena"><button id="up">Nose up</button><button id="down">Nose down</button><button id="glide">Glide</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let px=20,py=150,pitch=0,rings=0;function draw(){x.fillStyle='#09182a';x.fillRect(0,0,420,280);x.strokeStyle='#a3ff12';x.lineWidth=5;x.beginPath();x.arc(330,140,28,0,7);x.stroke();x.fillStyle='#00f5ff';x.beginPath();x.moveTo(px,py);x.lineTo(px-14,py+7);x.lineTo(px-9,py-7);x.fill();document.querySelector('#status').textContent=`Altitude ${Math.round(py)} · Rings ${rings}/3`}up.onclick=()=>pitch=Math.max(-2,pitch-.3);down.onclick=()=>pitch=Math.min(2,pitch+.3);glide.onclick=()=>{px+=45;py+=pitch*15+Math.random()*10-5;if(Math.abs(px-330)<35&&Math.abs(py-140)<35)rings++;if(px>400){px=20;py=150}draw()};draw();</script></body></html>
