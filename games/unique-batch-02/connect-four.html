<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Connect Four | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui,sans-serif;padding:18px}main{max-width:850px;margin:auto}h1{color:#00f5ff}a,button{color:#a3ff12}button{background:#111b2b;border:1px solid #00d9ff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#15334a}.panel{border:1px solid #194258;border-radius:14px;padding:14px;margin:12px 0;background:#09111d}.board{display:grid;gap:3px;max-width:540px;margin:15px auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,4vw,32px);padding:0;min-width:0}.status{color:#b7faff;min-height:28px}.back{display:inline-block;margin-bottom:8px}canvas{width:min(100%,600px);background:#02040a;border:1px solid #00c9ff;border-radius:10px;touch-action:manipulation}input{background:#101a29;color:white;border:1px solid #2c5265;border-radius:6px;padding:8px;width:48px;text-align:center}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main><a class="back" href="../../part2-games.html">← Part 2 game list</a><h1>Connect Four</h1><p>Drop discs into columns; connect four horizontally, vertically, or diagonally.</p><section class="panel"><div id="board" class="board" style="grid-template-columns:repeat(7,1fr);max-width:490px"></div><p class="status" id="status" aria-live="polite">Ready to play.</p><button onclick="location.reload()">Restart game</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let b=Array.from({length:6},()=>Array(7).fill('')),p='🔴',done=false;const el=document.querySelector('#board'),st=document.querySelector('#status');function draw(){el.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<7;c++){let x=document.createElement('button');x.className='cell';x.textContent=b[r][c]||'○';x.style.background=(r+c)%2?'#0b2132':'#071725';x.onclick=()=>drop(c);el.append(x)}st.textContent=done?'Game over. Restart to play again.':p+' to move — tap a column cell.'}function drop(c){if(done)return;let r=5;while(r>=0&&b[r][c])r--;if(r<0)return;b[r][c]=p;let dirs=[[1,0],[0,1],[1,1],[1,-1]],win=false;for(let [dr,dc] of dirs){let n=1;for(let s of [-1,1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr][cc]===p){n++;rr+=dr*s;cc+=dc*s}}if(n>=4)win=true}if(win){done=true;draw();st.textContent=p+' connects four and wins!';return}if(b.every(row=>row.every(Boolean))){done=true;draw();st.textContent='Board full — draw!';return}p=p==='🔴'?'🟡':'🔴';draw()}draw();</script><script src="../../arcade-juice.js" defer></script></body></html>
