<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Stack Sync — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Stack Sync</h1><p>Drop moving blocks and keep their overlapping edges aligned. Balance and precision stacking.</p><canvas id="c" width="640" height="420"></canvas><p>Tap / click / Space to drop the moving block. Blocks shrink if your alignment is off.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let stack=[{x:230,w:180,y:380}],m={x:0,w:180,dir:1},score=0,done=false;function drop(){if(done)return;let prev=stack[stack.length-1],left=Math.max(prev.x,m.x),right=Math.min(prev.x+prev.w,m.x+m.w),w=right-left;if(w<12){done=true;s.textContent='Tower collapsed at height '+score+'. Restart to rebuild.';return}stack.push({x:left,w,y:380-stack.length*28});m={x:0,w,dir:1};score++;if(score>=15){done=true;s.textContent='Perfect tower! 15 layers completed.'}else s.textContent='Layer '+score+' placed. Keep stacking!'}c.onclick=drop;onkeydown=e=>{if(e.code==='Space'){e.preventDefault();drop()}};function frame(){x.clearRect(0,0,640,420);x.fillStyle='#080d1b';x.fillRect(0,0,640,420);stack.forEach((b,i)=>{x.fillStyle=['#00f5ff','#a3ff12','#ff4fd8','#b84dff'][i%4];x.fillRect(b.x,b.y,b.w,25)});if(!done){m.x+=m.dir*3.5;if(m.x<0||m.x+m.w>640)m.dir*=-1;x.fillStyle='#ffb000';x.fillRect(m.x,380-stack.length*28,m.w,25);requestAnimationFrame(frame)}}frame();</script><script src="../../arcade-juice.js" defer></script></body></html>
