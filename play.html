<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070711"><meta name="description" content="Play any Gamers' Arcade game in one fast, installable player.">
<title>Play — Gamers' Arcade</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="arcade-icon.svg">
<link rel="stylesheet" href="batch4-games.css">
<style>
:root{--c:#00f5ff;--p:#bd66ff}body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.appbrand{font-weight:950;letter-spacing:.04em;color:#fff;text-decoration:none}.appbrand span{color:var(--c)}
.game-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #37446a;border-radius:999px;color:#cbd8f4;background:#11162a;font-size:12px}
.hero-title{font-size:clamp(25px,6vw,42px);line-height:1.05;margin:14px 0 8px;color:#fff;text-shadow:0 0 22px #00e5ff24}
.glow{color:var(--c)}.app-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.app-actions a,.app-actions button{border:1px solid #37466b;background:#11172a;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;font-weight:800}
.app-actions .hot{background:linear-gradient(100deg,#00e5ff,#bd66ff);color:#070711;border:0}
#loading{padding:22px;border:1px solid #2c3a5e;border-radius:16px;background:#0c1223;color:#b9cbe9}
@keyframes pulseGlow{0%{box-shadow:0 0 12px #00e5ff12}100%{box-shadow:0 0 32px #bd66ff20}}
#stage{animation:pulseGlow 2.6s ease-in-out infinite alternate}
.error{color:#ff91c8}.subline{color:#99abc9;font-size:13px}
</style></head>
<body><main class="wrap">
<div class="appbar"><a class="appbrand" href="index.html">⚡ GAMERS’ <span>ARCADE</span></a><span class="game-chip">✨ ONE PLAYER · 500 GAME CONFIGS</span></div>
<div class="app-actions"><a href="batch4-games.html">← All games</a><a href="index.html">Home</a><button id="installBtn" class="hot" hidden>⬇ Install app</button></div>
<div id="loading">Loading your game…</div>
<div id="gameShell" hidden>
<div class="game-chip" id="familyChip">ARCADE CHALLENGE</div>
<h1 class="hero-title" id="gameTitle">Loading…</h1>
<p id="gameDescription" class="subline"></p>
<header><div class="topstats"><span>Score: <b id="score">0</b></span><span class="game-chip">⭐ Total XP: <b id="totalXP">0</b></span><button id="restart" class="primary">↻ Restart run</button></div></header>
<section id="stage" aria-live="polite"></section><p id="status">Get ready!</p>
<div class="foot">Gamers’ Arcade · Single-player engine · Your progress is stored on this device.</div>
</div>
</main>
<script>
(async()=>{
 const params=new URLSearchParams(location.search);let id=Number(params.get('id')||1);
 const loading=document.getElementById('loading');
 try{
   const res=await fetch('batch4-games-manifest.json');if(!res.ok)throw new Error('Could not load the game list');
   const data=await res.json();const game=data.pages.find(g=>g.id===id)||data.pages[0];
   if(!game)throw new Error('No game found');
   const descriptions={
    timing:'Stop the moving needle inside the target window. Keep your timing sharp.',
    target:'Find the correct targets and avoid decoys. Accuracy is everything.',
    sequence:'Memorize the pattern, then repeat it in the right order.',
    pattern:'Read the pattern, remember it, and reproduce it.',
    pairs:'Flip cards and match every pair with the fewest mistakes.',
    equation:'Solve the challenge and push your score higher.',
    word:'Find the hidden word before the challenge ends.',
    maze:'Navigate the maze and reach the goal.',
    slide:'Move the tiles into the target arrangement.',
    snake:'Guide your trail, collect points, and avoid collisions.',
    pong:'Keep the rally alive and build your score.',
    breakout:'Bounce, aim, and clear the challenge.',
    shooter:'Hit the targets and stay alert.',
    dodge:'Avoid hazards for as long as possible.',
    catch:'Catch the useful items and avoid distractions.',
    platformer:'Time your moves and jump through the challenge.',
    racer:'Switch lanes and survive the run.',
    fishing:'Time your cast and reel in a successful catch.',
    sokoban:'Plan your pushes and solve the puzzle.',
    mirror:'Rotate the mirrors and guide the beam.',
    bubble:'Aim carefully and make every shot count.',
    orbit:'Time your release and capture the moving target.',
    golf:'Aim your shot and complete the course objective.',
    launcher:'Choose your angle and launch toward the goal.',
    cards:'Choose smart actions and complete the card challenge.',
    defend:'Protect your base and complete the defence objective.',
    rotate:'Rotate the pieces to connect the route.',
    switchmaze:'Activate switches and find the exit.'
   };
   window.ARCADE_GAME={...game,title:game.title,id:game.id,description:descriptions[game.kind]||('Complete the '+game.family+' challenge. Try different difficulty multipliers to sharpen your run.'),difficulty:game.difficulty||1,target:game.target||8,timeLimit:game.timeLimit||30,moveLimit:game.moveLimit||20,hazards:game.hazards||2};
   document.title=game.title+' — Gamers’ Arcade';
   document.getElementById('gameTitle').textContent=game.title;
   document.getElementById('familyChip').textContent=game.family+' · GAME '+String(game.id).padStart(3,'0')+' / 500';
   document.getElementById('gameDescription').textContent=window.ARCADE_GAME.description;
   loading.hidden=true;document.getElementById('gameShell').hidden=false;
   const xpDisplay=document.getElementById('totalXP');
   function refreshXP(){try{xpDisplay.textContent=(Number(localStorage.getItem('ga-xp-total'))||0).toLocaleString()}catch(e){xpDisplay.textContent='Unavailable'}}
   refreshXP();window.addEventListener('arcade:xp-updated',refreshXP);window.addEventListener('pageshow',refreshXP);
   const script=document.createElement('script');script.src='batch4-runtime.js';script.onload=()=>{};script.onerror=()=>{loading.hidden=false;loading.innerHTML='<span class="error">Could not load the game engine. Refresh the page or check the uploaded files.</span>'};document.body.appendChild(script);
 }catch(e){loading.innerHTML='<span class="error">Game list could not load. Make sure batch4-games-manifest.json is in the same folder as play.html.</span>';console.error(e)}
 let deferredPrompt=null;const installBtn=document.getElementById('installBtn');
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});
 installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true});
 if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
})();
</script></body></html>
