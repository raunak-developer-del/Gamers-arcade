<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Beat Reactor — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Beat Reactor</h1><p>Tap when the pulse crosses the target ring. Rhythm and reaction timing.</p><canvas id="c" width="640" height="360"></canvas><p>Tap / click when the expanding ring reaches the target circle.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let r=8,dir=1,score=0,tries=0,alive=true;function draw(){x.clearRect(0,0,640,360);x.fillStyle='#080d1b';x.fillRect(0,0,640,360);x.strokeStyle='#ff4fd8';x.lineWidth=5;x.beginPath();x.arc(320,180,100,0,7);x.stroke();x.strokeStyle='#00f5ff';x.lineWidth=3;x.beginPath();x.arc(320,180,r,0,7);x.stroke();x.fillStyle='#effcff';x.font='20px system-ui';x.fillText('PERFECT ZONE: 88–112',225,35);if(alive){r+=dir*2.1;if(r>180||r<8)dir*=-1;requestAnimationFrame(draw)}}function hit(){if(!alive)return;tries++;let d=Math.abs(r-100);if(d<12){score+=100;s.textContent='Perfect beat! '+score+' points'}else if(d<28){score+=40;s.textContent='Good beat! '+score+' points'}else{s.textContent='Off beat. Score '+score}if(tries>=10){alive=false;s.textContent+=' · Session over after 10 beats.'}}c.onclick=hit;c.addEventListener('touchstart',e=>{e.preventDefault();hit()},{passive:false});draw();</script><script src="../../arcade-juice.js" defer></script></body></html>
