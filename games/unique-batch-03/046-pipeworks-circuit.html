<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Pipeworks Circuit | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Pipeworks Circuit</h1><p>Rotate pipe tiles to connect the source to the destination.</p><section class="panel"><div id="pipes" class="arena" style="display:grid;grid-template-columns:repeat(4,1fr);max-width:360px"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let tiles=Array.from({length:16},(_,i)=>({v:['└','─','┐','│','┌','─','┘','│','┌','┐','─','└','│','─','┌','┘'][i],rot:Math.random()*4|0}));function draw(){let e=document.querySelector('#pipes');e.innerHTML='';tiles.forEach((t,i)=>{let b=document.createElement('button');b.className='cell';b.style.fontSize='1.8rem';b.textContent=t.v;b.style.transform=`rotate(${t.rot*90}deg)`;b.onclick=()=>{t.rot=(t.rot+1)%4;check();draw()};e.append(b)});document.querySelector('#status').textContent='Rotate pipe pieces. Connect a continuous route from top-left to bottom-right.'}function check(){if(tiles[0].rot===0&&tiles[1].rot===1&&tiles[2].rot===2&&tiles[3].rot===3&&tiles[7].rot===3&&tiles[11].rot===2&&tiles[15].rot===2)document.querySelector('#status').textContent='Circuit connected!'}draw();</script></body></html>
