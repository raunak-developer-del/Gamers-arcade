<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Pocket Farm Manager | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Pocket Farm Manager</h1><p>Plant seeds, harvest crops, and earn coins to expand your tiny farm.</p><section class="panel"><div class="arena"><button id="plant">Plant seed (3 coins)</button><button id="water">Water crops</button><button id="harvest">Harvest ready crops</button></div><p id="farm"></p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let coins=12,crops=[],water=0;function draw(){document.querySelector('#farm').textContent=`Coins ${coins} · Water ${water} · Crops: `+crops.map(c=>c.grown?'🌾':'🌱').join(' ');document.querySelector('#status').textContent='Grow crops to earn coins.'}document.querySelector('#plant').onclick=()=>{if(coins>=3){coins-=3;crops.push({grown:false,watered:false});draw()}};document.querySelector('#water').onclick=()=>{if(water<1){water++;crops.forEach(c=>c.watered=true);document.querySelector('#status').textContent='Crops watered. Harvest next.'}else document.querySelector('#status').textContent='No water left.'};document.querySelector('#harvest').onclick=()=>{let ready=crops.filter(c=>c.watered&&!c.grown);ready.forEach(c=>c.grown=true);let n=crops.filter(c=>c.grown).length;coins+=n*5;crops=crops.filter(c=>!c.grown);water=0;draw()};draw();</script></body></html>
