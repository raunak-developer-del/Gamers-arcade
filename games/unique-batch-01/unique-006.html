<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Lunar Landing — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Lunar Landing</h1><p>Control thrust and horizontal drift to land softly on the pad. Physics-based landing, not dodging.</p><canvas id="c" width="640" height="420"></canvas><p>Hold ↑ / W to thrust; ← → / A D to steer. Land on the green pad slowly.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let ship={x:90,y:65,vx:1,vy:0},keys={},done=false;onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;c.addEventListener('touchstart',e=>{let r=c.getBoundingClientRect(),px=(e.touches[0].clientX-r.left)/r.width*640;keys[px<210?'a':px>430?'d':'w']=true},{passive:true});c.addEventListener('touchend',()=>keys={});function frame(){x.clearRect(0,0,640,420);x.fillStyle='#080d1b';x.fillRect(0,0,640,420);for(let i=0;i<70;i++){x.fillStyle='#496078';x.fillRect((i*97)%640,(i*53)%330,2,2)}x.fillStyle='#a3ff12';x.fillRect(450,380,110,8);if(!done){if(keys.w||keys.arrowup)ship.vy-=.09;if(keys.a||keys.arrowleft)ship.vx-=.06;if(keys.d||keys.arrowright)ship.vx+=.06;ship.vy+=.045;ship.x+=ship.vx;ship.y+=ship.vy;if(ship.y>372){done=true;if(ship.x>450&&ship.x<560&&Math.abs(ship.vy)<1.4&&Math.abs(ship.vx)<1.2)s.textContent='Soft landing! Mission complete.';else s.textContent='Crash landing! Try gentler thrust and drift.'}}x.save();x.translate(ship.x,ship.y);x.fillStyle='#00f5ff';x.beginPath();x.moveTo(0,-14);x.lineTo(11,10);x.lineTo(-11,10);x.closePath();x.fill();x.restore();x.fillStyle='#effcff';x.font='16px system-ui';x.fillText('Altitude '+Math.max(0,Math.round(380-ship.y))+' | Vx '+ship.vx.toFixed(1)+' Vy '+ship.vy.toFixed(1),15,25);if(!done)requestAnimationFrame(frame)}frame();</script><script src="../../arcade-juice.js" defer></script></body></html>
