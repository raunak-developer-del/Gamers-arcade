<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Minefield Logic — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Pixel Nonogram</h1><p>Use row and column clues to reveal the hidden pixel pattern. Logic-grid deduction, not mine finding.</p><div id="clues" style="display:flex;gap:12px"></div><div id="board" style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:360px"></div><p>Tap cells to reveal the 5×5 pixel picture.</p><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const board=document.querySelector('#board'),clues=document.querySelector('#clues'),s=document.querySelector('#status');const pattern=['00100','01110','11111','10101','00100'];let opened=new Set();clues.innerHTML='<div>Rows: 1 / 3 / 5 / 3 / 1</div><div>Cols: 3 / 4 / 5 / 3 / 3</div>';for(let i=0;i<25;i++){let b=document.createElement('button');b.style.cssText='aspect-ratio:1;margin:0;padding:0';b.textContent='?';b.onclick=()=>{if(opened.has(i))return;opened.add(i);let yes=pattern[Math.floor(i/5)][i%5]==='1';b.textContent=yes?'■':'·';b.style.background=yes?'#00f5ff':'#142034';if(opened.size===25){let got=[...board.children].filter((q,j)=>pattern[Math.floor(j/5)][j%5]==='1'&&q.textContent==='■').length;s.textContent=got===15?'Picture solved!':'Grid revealed—compare the pattern and try again.'}};board.append(b)}</script><script src="../../arcade-juice.js" defer></script></body></html>
