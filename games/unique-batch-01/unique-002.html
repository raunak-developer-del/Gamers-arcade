<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Wordstorm — Gamers' Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a);margin:0 0 6px}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}small{color:#7189a5}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Wordstorm</h1><p>Type each falling word before it reaches the bottom. Keyboard accuracy is the challenge.</p><canvas id="c" width="640" height="420"></canvas><p>Type the highlighted word, then press Enter.</p><input id="entry" autocomplete="off" placeholder="type word here"><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../index.html">← Arcade library</a><p><small>Original distinct-mechanic game · Batch 1 of 50 planned batches</small></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),e=document.querySelector('#entry'),s=document.querySelector('#status'),words=['comet','nebula','rocket','pixel','plasma','galaxy','quantum','meteor','orbit','cosmos','laser','asteroid'];let target=words[Math.floor(Math.random()*words.length)],y=30,score=0,alive=true;function frame(){x.clearRect(0,0,640,420);x.fillStyle='#080d1b';x.fillRect(0,0,640,420);x.strokeStyle='#ff4fd8';x.beginPath();x.moveTo(0,385);x.lineTo(640,385);x.stroke();x.fillStyle='#00f5ff';x.font='bold 30px monospace';x.fillText(target,40,y);if(alive){y+=.55+score*.04;if(y>380){alive=false;s.textContent='Word escaped! Final score '+score+'. Restart to retry.'}else requestAnimationFrame(frame)}}e.focus();e.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&alive){if(e.value.trim().toLowerCase()===target){score++;target=words[Math.floor(Math.random()*words.length)];y=25;s.textContent='Correct! Score '+score;e.value='';}else s.textContent='Not quite—keep typing the falling word.'}});frame();</script><script src="../../arcade-juice.js" defer></script></body></html>
