<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Minesweeper Classic — Gamers’ Arcade</title><style>:root{--a:#00f5ff}*{box-sizing:border-box}body{margin:0;background:#05070e;color:#effcff;font:16px system-ui;min-height:100vh;padding:18px;display:flex;justify-content:center}.wrap{width:min(100%,760px)}h1{color:var(--a);text-shadow:0 0 16px var(--a)}p{color:#9db5cb}canvas{width:100%;height:auto;background:#080d1b;border:1px solid var(--a);border-radius:14px;touch-action:manipulation;display:block}button,a,input{background:#111a2c;color:#effcff;border:1px solid var(--a);border-radius:9px;padding:10px 13px;margin:4px;text-decoration:none}#status{min-height:30px;color:#a3ff12;padding:8px}</style><link rel="stylesheet" href="../../arcade-juice.css"></head><body><main class="wrap"><h1>Minesweeper Classic</h1><p>Reveal safe squares and flag mines using adjacent mine counts.</p><div id="board" style="display:grid;grid-template-columns:repeat(8,1fr);max-width:400px"></div><div id="status">Ready!</div><button onclick="location.reload()">Restart</button> <a href="../../unique-games-batch-01.html">← Part 1 games</a><script>const b=document.querySelector('#board'),s=document.querySelector('#status');let M=new Set(),open=new Set(),flags=new Set(),end=false;while(M.size<10)M.add(Math.random()*64|0);function around(i){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let a=i%8+dx,y=(i/8|0)+dy;if(a>=0&&a<8&&y>=0&&y<8&&M.has(y*8+a))n++}return n}for(let i=0;i<64;i++){let q=document.createElement('button');q.style.cssText='aspect-ratio:1;margin:1px;padding:0';q.textContent='?';q.oncontextmenu=e=>{e.preventDefault();if(!end&&!open.has(i)){flags.has(i)?flags.delete(i):flags.add(i);q.textContent=flags.has(i)?'⚑':'?'}};q.onclick=()=>{if(end||open.has(i)||flags.has(i))return;open.add(i);if(M.has(i)){q.textContent='✹';end=true;s.textContent='Mine hit!'}else{let n=around(i);q.textContent=n||'·';q.style.background='#20334c';if(open.size===54){end=true;s.textContent='Minefield cleared!'}}};b.append(q)}s.textContent='Find 54 safe squares. Right-click or long-press to flag.';</script></main><script src="../../arcade-juice.js" defer></script></body></html>
