<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tower Tap 479 — Gamers' Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050711;color:#eaf2ff;font:16px system-ui,Arial;display:flex;justify-content:center;min-height:100vh}main{width:min(96vw,620px);padding:16px 12px 28px;text-align:center}h1{color:#67aaff;text-shadow:0 0 14px #67aaff80;font-size:clamp(22px,5vw,32px);margin:6px}p{color:#b8c5dc;font-size:14px}canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;background:#070a16;border:2px solid #67aaff;border-radius:12px;touch-action:manipulation}.stats,.buttons{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}.buttons{justify-content:center}button,a{background:#101b2d;color:#eff6ff;border:1px solid #7795bd;border-radius:9px;padding:10px 14px;font-weight:700;text-decoration:none}#msg{min-height:22px;color:#9cff45;font-size:13px}
</style></head><body><main><h1>Tower Tap 479</h1><p>Tap when the moving platform lines up. Stack blocks as high as you can!</p>
<div class="stats"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span><span>Blocks: <b id="blocks">1</b></span></div>
<canvas id="g" width="480" height="600"></canvas><div id="msg">Tap Start / Tap to begin.</div><div class="buttons"><button id="start">Start / Tap</button><button id="restart">Restart</button><a href="../index.html">Game library</a></div></main>
<script>
(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),W=480,H=600,$=id=>document.getElementById(id);let stack,m,score,best=0,run=false,over=false,raf=0,last=0;try{best=Number(localStorage.getItem('towerTapBest')||0)}catch(e){$('best').textContent=0}
function reset(){stack=[{x:120,y:530,w:240,h:24,color:'#67aaff'}];m={x:0,y:494,w:240,h:24,dir:1,speed:2.7};score=0;run=false;over=false;update();$('msg').textContent='Tap Start / Tap to begin.';draw()}
function update(){$('score').textContent=score;$('best').textContent=best;$('blocks').textContent=stack.length}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#070a16';x.fillRect(0,0,W,H);x.strokeStyle='#17223a';for(let i=0;i<W;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=30){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
let shift=Math.max(0,stack.length-10)*24;x.save();x.translate(0,shift);for(const b of stack){x.fillStyle=b.color;x.shadowColor=b.color;x.shadowBlur=9;x.fillRect(b.x,b.y,b.w,b.h);x.shadowBlur=0;x.strokeStyle='#ffffff70';x.strokeRect(b.x,b.y,b.w,b.h)}x.restore();
if(!over){x.fillStyle='#ffcf5a';x.shadowColor='#ffcf5a';x.shadowBlur=12;x.fillRect(m.x,m.y,m.w,m.h);x.shadowBlur=0}if(!run){x.textAlign='center';x.fillStyle='#eaf2ff';x.font='bold 23px system-ui';x.fillText(over?'TOWER OVER':'TOWER TAP',240,80);x.font='14px system-ui';x.fillStyle='#b8c5dc';x.fillText(over?'Press Restart to try again':'Tap to place next block',240,106)}}
function place(){if(over)return;if(!run){run=true;$('msg').textContent='Tap when aligned!';last=performance.now();raf=requestAnimationFrame(loop);return}let top=stack[stack.length-1],left=Math.max(top.x,m.x),right=Math.min(top.x+top.w,m.x+m.w),w=right-left;if(w<12){over=true;run=false;$('msg').textContent='Missed! Restart to try again.';draw();return}score++;stack.push({x:left,y:top.y-36,w,h:24,color:`hsl(${(score*31+205)%360} 90% 65%)`});m={x:m.dir>0?-w:W,y:top.y-72,w,h:24,dir:m.dir,speed:Math.min(7,2.7+score*.12)};if(score>best){best=score;try{localStorage.setItem('towerTapBest',best)}catch(e){}}update();$('msg').textContent='Nice! Keep stacking.';draw()}
function loop(t){if(!run)return;let d=Math.min((t-last)/16.67,2);last=t;m.x+=m.speed*m.dir*d;if(m.x+m.w>W){m.x=W-m.w;m.dir=-1}if(m.x<0){m.x=0;m.dir=1}draw();raf=requestAnimationFrame(loop)}
c.addEventListener('pointerdown',place);$('start').onclick=place;$('restart').onclick=reset;window.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();place()}});reset();
})();
</script></body></html>
