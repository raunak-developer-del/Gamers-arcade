<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Chromatic Alchemist | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Chromatic Alchemist</h1><p>Mix primary colours to create the requested colour.</p><section class="panel"><h2 class="arena">Target: <span id="target">PURPLE</span></h2><div class="arena"><button data-c="RED">Red</button><button data-c="BLUE">Blue</button><button data-c="YELLOW">Yellow</button><button data-c="WHITE">White</button><button id="mix">Mix</button></div><p id="pot"></p><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>let picked=[];const target=['PURPLE','GREEN','ORANGE','PINK'];let round=0;document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{picked.push(b.dataset.c);document.querySelector('#pot').textContent='Pot: '+picked.join(' + ')});document.querySelector('#mix').onclick=()=>{let sets={PURPLE:['BLUE','RED'],GREEN:['BLUE','YELLOW'],ORANGE:['RED','YELLOW'],PINK:['RED','WHITE']};let t=target[round%4],ok=sets[t].every(c=>picked.includes(c))&&picked.length===2;document.querySelector('#status').textContent=ok?'Perfect mixture!':'That mixture does not match the target.';if(ok){round++;document.querySelector('#target').textContent=target[round%4]}picked=[];document.querySelector('#pot').textContent=''};</script></body></html>
