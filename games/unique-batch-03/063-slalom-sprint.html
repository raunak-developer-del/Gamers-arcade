<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Slalom Sprint | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Slalom Sprint</h1><p>Steer left and right to pass through gates without hitting flags.</p><section class="panel"><canvas id="game" width="420" height="420"></canvas><div class="arena"><button id="left">◀ Left</button><button id="right">Right ▶</button></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let px=210,gate=0,score=0,miss=0;function draw(){x.fillStyle='#d9f4ff';x.fillRect(0,0,420,420);x.fillStyle='#a4cce2';for(let y=0;y<420;y+=30)x.fillRect(0,y,420,2);let gx=gate%2?125:295;x.fillStyle='#ff4c9a';x.fillRect(gx-35,gate*45%360,8,30);x.fillRect(gx+35,gate*45%360,8,30);x.fillStyle='#00f5ff';x.beginPath();x.arc(px,350,12,0,7);x.fill();document.querySelector('#status').textContent=`Gates passed ${score} · Misses ${miss}`}function move(d){px=Math.max(25,Math.min(395,px+d*35));let gx=gate%2?125:295;if(Math.abs(px-gx)<38){score++;gate++}else{miss++;gate++}draw()}document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);draw();</script></body></html>
