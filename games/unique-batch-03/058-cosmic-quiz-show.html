<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>Cosmic Quiz Show | Gamers’ Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#05070e;color:#effcff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{color:#00f5ff}a{color:#a3ff12}.panel{background:#09111d;border:1px solid #15516a;border-radius:16px;padding:16px;margin:14px 0}.arena{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px auto;max-width:700px}.cell,button,select,input{font:inherit;color:#effcff;background:#101e30;border:1px solid #00c9ff;border-radius:9px;padding:10px;cursor:pointer}.cell{min-width:42px;min-height:42px}.cell:disabled{opacity:.8;cursor:default}.status{min-height:28px;color:#a7f7ff}canvas{width:min(100%,640px);height:auto;background:#02040a;border:1px solid #00c9ff;border-radius:12px;touch-action:manipulation}.muted{color:#a6bdca;font-size:.9rem}</style></head><body><main><a href="../../part3-games.html">← Part 3 collection</a><h1>Cosmic Quiz Show</h1><p>Answer quick space and science trivia to build your score.</p><section class="panel"><h2 id="question"></h2><div id="answers" class="arena"></div><p class="status" id="status" aria-live="polite">Ready!</p><button id="restart" type="button">Restart</button></section><p><a href="../../index.html">Arcade home</a></p></main><script>const qs=[['Which planet is known as the Red Planet?',['Mars','Venus','Neptune'],0],['What is Earth’s natural satellite?',['Sun','Moon','Europa'],1],['Which gas do plants absorb?',['Oxygen','Carbon dioxide','Helium'],1],['How many sides has a hexagon?',['5','6','8'],1],['Which star is closest to Earth?',['Sirius','Sun','Polaris'],1]];let i=0,score=0;function draw(){let q=qs[i%qs.length];document.querySelector('#question').textContent=q[0];let e=document.querySelector('#answers');e.innerHTML='';q[1].forEach((v,j)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(j===q[2])score++;i++;document.querySelector('#status').textContent=`Score ${score}/${i}`;draw()};e.append(b)})}draw();</script></body></html>
